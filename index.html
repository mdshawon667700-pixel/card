<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PocketFlow" />
  <meta name="theme-color" id="metaThemeColor" content="#f5f6f8" />
  <title>PocketFlow — Personal Card & Expense Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      --bg-app: #f5f6f8;
      --bg-card: #ffffff;
      --bg-subtle: #eceef2;
      --bg-input: #f0f2f5;
      --text-primary: #14171f;
      --text-secondary: #687082;
      --text-muted: #98a0b0;
      --border-color: rgba(20, 23, 31, 0.08);
      --accent-dark: #14171f;
      --accent-dark-text: #ffffff;
      --emerald: #10b981;
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --shadow-sm: 0 2px 10px rgba(17, 24, 39, 0.04);
      --shadow-md: 0 10px 28px rgba(17, 24, 39, 0.08);
      --shadow-lg: 0 20px 48px rgba(17, 24, 39, 0.14);
      --theme-transition: background-color 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                          color 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                          border-color 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                          box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="dark"] {
      --bg-app: #0f1218;
      --bg-card: #181c26;
      --bg-subtle: #212734;
      --bg-input: #1d222e;
      --text-primary: #eef1f6;
      --text-secondary: #929bae;
      --text-muted: #626b7e;
      --border-color: rgba(255, 255, 255, 0.07);
      --accent-dark: #eef1f6;
      --accent-dark-text: #0f1218;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.22);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.34);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.48);
    }

    [data-theme="emerald"] {
      --bg-app: #ecf5f1;
      --bg-card: #ffffff;
      --bg-subtle: #dcece5;
      --bg-input: #e5f1ec;
      --text-primary: #0b291e;
      --text-secondary: #486b5e;
      --text-muted: #7a9c8f;
      --border-color: rgba(11, 41, 30, 0.09);
      --accent-dark: #065f46;
      --accent-dark-text: #ffffff;
      --emerald: #059669;
      --emerald-bg: rgba(5, 150, 105, 0.14);
      --shadow-sm: 0 2px 10px rgba(6, 95, 70, 0.05);
      --shadow-md: 0 10px 28px rgba(6, 95, 70, 0.10);
      --shadow-lg: 0 20px 48px rgba(6, 95, 70, 0.16);
    }

    [data-theme="ocean"] {
      --bg-app: #0b132b;
      --bg-card: #1c2541;
      --bg-subtle: #283559;
      --bg-input: #222e4f;
      --text-primary: #f0f4ff;
      --text-secondary: #9fb1d6;
      --text-muted: #6a7fa8;
      --border-color: rgba(160, 196, 255, 0.1);
      --accent-dark: #38bdf8;
      --accent-dark-text: #081226;
      --emerald: #2dd4bf;
      --emerald-bg: rgba(45, 212, 191, 0.15);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.38);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.52);
    }

    [data-theme="sunset"] {
      --bg-app: #fbf5f0;
      --bg-card: #ffffff;
      --bg-subtle: #f3e6dc;
      --bg-input: #f7ede5;
      --text-primary: #2d1b14;
      --text-secondary: #7a5c50;
      --text-muted: #a88b7f;
      --border-color: rgba(45, 27, 20, 0.08);
      --accent-dark: #c2410c;
      --accent-dark-text: #ffffff;
      --emerald: #0d9488;
      --emerald-bg: rgba(13, 148, 136, 0.12);
      --shadow-sm: 0 2px 10px rgba(194, 65, 12, 0.05);
      --shadow-md: 0 10px 28px rgba(194, 65, 12, 0.10);
      --shadow-lg: 0 20px 48px rgba(194, 65, 12, 0.16);
    }

    [data-theme="oled"] {
      --bg-app: #000000;
      --bg-card: #111113;
      --bg-subtle: #1c1c20;
      --bg-input: #17171a;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --text-muted: #58585e;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-dark: #ffffff;
      --accent-dark-text: #000000;
      --emerald: #30d158;
      --emerald-bg: rgba(48, 209, 88, 0.15);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.7);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      transition: var(--theme-transition);
    }

    body {
      display: flex;
      justify-content: center;
    }

    /* 3-Zone App Shell */
    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      background-color: var(--bg-app);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      transition: var(--theme-transition);
    }

    /* Zone 1: Top Header & Hero Balance */
    .top-zone {
      flex: 0 0 auto;
      position: relative;
      z-index: 3;
      background: var(--bg-app);
      transition: var(--theme-transition);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 20px 10px;
      gap: 8px;
    }

    .wallet-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .wallet-heading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .wallet-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .mini-totals {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: var(--theme-transition);
    }

    .mini-totals span.val-eur {
      color: var(--text-primary);
      font-weight: 700;
    }

    .mini-totals span.val-bdt {
      color: var(--emerald);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), var(--theme-transition);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .lang-badge-btn {
      width: auto;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .hero-section {
      padding: 10px 20px 12px;
      text-align: center;
    }

    .hero-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-height: 16px;
    }

    .hero-balance {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 4px 0 14px;
      font-variant-numeric: tabular-nums;
      min-height: 50px;
      line-height: 1.15;
      transition: color 0.3s ease;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), var(--theme-transition);
    }

    .pill-btn:active {
      transform: scale(0.94);
    }

    .pill-add {
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      box-shadow: var(--shadow-md);
    }

    .pill-expense {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .pill-transfer {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    /* Zone 2: Middle Dedicated Card Stage */
    .cards-wrapper {
      flex: 0 0 auto;
      padding: 4px 0 10px;
      position: relative;
      z-index: 2;
      background: var(--bg-app);
      transition: var(--theme-transition);
    }

    .cards-carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
      padding: 6px 20px 12px;
      scrollbar-width: none;
    }

    .cards-carousel::-webkit-scrollbar {
      display: none;
    }

    .wallet-card {
      flex: 0 0 calc(100% - 24px);
      max-width: 360px;
      height: 198px;
      border-radius: 20px;
      padding: 20px 22px;
      color: #ffffff;
      scroll-snap-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      overflow: hidden;
      transform: translateZ(0);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .wallet-card:active {
      transform: scale(0.975);
    }

    .wallet-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 40%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.25) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .wallet-card .glare-shine {
      position: absolute;
      top: -150%;
      left: -50%;
      width: 200%;
      height: 300%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
      transform: rotate(-30deg);
      pointer-events: none;
      z-index: 1;
    }

    .wallet-card.glow-success {
      box-shadow: 0 0 0 3px var(--emerald), 0 14px 36px rgba(16, 185, 129, 0.32);
    }

    .card-chip {
      width: 36px;
      height: 27px;
      background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 40%, #aa771c 80%, #ffd700 100%);
      border-radius: 5px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 0 1.5px 3px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }

    .card-chip::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 3px;
      background: linear-gradient(to right, transparent 48%, rgba(0,0,0,0.15) 48%, rgba(0,0,0,0.15) 52%, transparent 52%),
                  linear-gradient(to bottom, transparent 48%, rgba(0,0,0,0.15) 48%, rgba(0,0,0,0.15) 52%, transparent 52%);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .card-brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.03em;
      opacity: 0.9;
    }

    .card-currency-pill {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .card-mid {
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .card-bal-label {
      font-size: 10.5px;
      opacity: 0.72;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-bal-val {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1.5px 3px rgba(0,0,0,0.25);
    }

    .card-contactless {
      opacity: 0.75;
      font-size: 16px;
      transform: rotate(90deg) scaleY(-1);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.05em;
      z-index: 2;
      opacity: 0.9;
    }

    .card-network-logo {
      font-weight: 800;
      font-style: italic;
      font-size: 15px;
      letter-spacing: -0.05em;
      opacity: 0.95;
      text-shadow: 0 1px 1px rgba(0,0,0,0.15);
    }

    .card-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      height: 14px;
      margin-top: 2px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--text-muted);
      opacity: 0.35;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .dot.active {
      width: 18px;
      background: var(--text-primary);
      opacity: 1;
    }

    /* Zone 3: Bottom Stable Activity Zone */
    .activity-zone {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 8px;
      gap: 8px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
    }

    .activity-filter-bar {
      display: flex;
      gap: 8px;
      padding: 0 20px 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      touch-action: manipulation;
      transition: var(--theme-transition);
    }

    .filter-tab.active {
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      border-color: var(--accent-dark);
      box-shadow: var(--shadow-sm);
    }

    .home-search-row {
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
    }

    .home-search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .home-search-input {
      width: 100%;
      padding: 8px 30px 8px 32px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, var(--theme-transition);
    }

    .home-search-input:focus {
      border-color: var(--emerald);
    }

    .home-search-icon {
      position: absolute;
      left: 11px;
      font-size: 12px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .home-search-clear {
      position: absolute;
      right: 10px;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .home-cat-select {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      outline: none;
      max-width: 140px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--theme-transition);
    }

    .month-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      transition: var(--theme-transition);
    }

    .month-in {
      color: var(--emerald);
    }

    .month-out {
      color: var(--danger);
    }

    .tx-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.16s ease, var(--theme-transition);
    }

    .tx-item.tx-enter {
      animation: slideUpFade 0.28s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .tx-item:active {
      transform: scale(0.98);
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .tx-avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--bg-subtle);
      flex-shrink: 0;
      transition: var(--theme-transition);
    }

    .tx-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .tx-cat {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .tx-amount {
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .tx-amount.add {
      color: var(--emerald);
    }

    .tx-amount.expense {
      color: var(--text-primary);
    }

    .tx-amount.transfer {
      color: var(--blue);
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 22px;
      transition: var(--theme-transition);
    }

    /* Fullscreen Slide-up Entry Overlay */
    .overlay-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-app);
      z-index: 100;
      display: flex;
      flex-direction: column;
      max-width: 440px;
      margin: 0 auto;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.4s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    .overlay-screen.open {
      transform: translateY(0);
    }

    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      position: relative;
      z-index: 102;
    }

    .overlay-title {
      font-size: 16px;
      font-weight: 700;
    }

    .cat-strip {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 20px 14px;
      scrollbar-width: none;
    }

    .cat-strip::-webkit-scrollbar {
      display: none;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .cat-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, var(--theme-transition);
    }

    .cat-item.selected .cat-circle {
      border-color: var(--emerald);
      transform: scale(1.08);
      background: var(--emerald-bg);
    }

    .cat-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cat-item.selected .cat-label {
      color: var(--text-primary);
      font-weight: 700;
    }

    .transfer-bar {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 6px 20px 12px;
    }

    .transfer-bar.visible {
      display: flex;
    }

    .transfer-box-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .transfer-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .transfer-row > div {
      flex: 1;
      min-width: 0;
    }

    .fx-summary-box {
      background: var(--bg-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .amount-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
    }

    .native-amount-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 24px;
      padding: 12px 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, var(--theme-transition);
    }

    .native-amount-wrapper:focus-within {
      border-color: var(--emerald);
    }

    .native-sym {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .native-amount-input {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .note-input {
      margin-top: 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13.5px;
      color: var(--text-primary);
      text-align: center;
      width: 85%;
      max-width: 290px;
      outline: none;
      transition: var(--theme-transition);
    }

    .presets-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 6px 16px 14px;
      flex-wrap: wrap;
    }

    .preset-chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.14s ease, var(--theme-transition);
    }

    .preset-chip:active {
      transform: scale(0.92);
    }

    .send-cta {
      margin: 10px 20px 20px;
      height: 54px;
      border-radius: 18px;
      border: none;
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: transform 0.16s ease, var(--theme-transition);
    }

    .send-cta:active {
      transform: scale(0.97);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 15, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 150;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .bottom-sheet {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border-radius: 30px 30px 0 0;
      padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-lg);
      animation: sheetRise 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 88vh;
      overflow-y: auto;
      transition: var(--theme-transition);
    }

    @keyframes sheetRise {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .theme-option-card {
      padding: 12px;
      border-radius: 16px;
      border: 2px solid var(--border-color);
      background: var(--bg-input);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .theme-option-card.active {
      border-color: var(--emerald);
      background: var(--emerald-bg);
    }

    .theme-option-card:active {
      transform: scale(0.97);
    }

    .theme-preview-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .lang-option-btn {
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .lang-option-btn.active {
      border-color: var(--emerald);
      background: var(--emerald-bg);
    }

    .action-sheet-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .action-sheet-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.14s ease, var(--theme-transition);
    }

    .action-sheet-btn:active {
      transform: scale(0.98);
    }

    .action-sheet-btn.edit-btn {
      background: var(--blue-bg);
      color: var(--blue);
      border-color: transparent;
    }

    .action-sheet-btn.delete-btn {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: transparent;
    }

    .confirm-stage {
      text-align: center;
      padding: 18px 10px;
      position: relative;
    }

    .ring-wrapper {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3.5px solid var(--bg-subtle);
      border-top-color: var(--emerald);
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .ring-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ring-avatar.done {
      background: var(--emerald);
      color: #ffffff;
      transform: scale(1.06);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .ring-avatar.declined {
      background: var(--danger);
      color: #ffffff;
      transform: scale(1.06);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
    }

    .confirm-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .confirm-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .confetti-piece {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      top: 48px;
      left: 50%;
      pointer-events: none;
      animation: confettiFly 0.75s ease-out forwards;
    }

    @keyframes confettiFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(240deg) scale(0.4); opacity: 0; }
    }

    .tabs-bar {
      display: flex;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--theme-transition);
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: var(--theme-transition);
    }

    .form-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .form-row .form-input, .form-row .form-select {
      flex: 1;
      min-width: 0;
    }

    .color-swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .swatch {
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
    }

    .swatch.active {
      border-color: var(--text-primary);
      transform: scale(1.08);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-height: 170px;
      overflow-y: auto;
      padding: 4px;
    }

    .icon-choice {
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: var(--bg-input);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, var(--theme-transition);
    }

    .icon-choice.active {
      border-color: var(--text-primary);
      background: var(--bg-subtle);
      transform: scale(1.06);
    }

    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: var(--danger);
      color: #fff;
    }

    .toast-undo {
      background: var(--emerald);
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden; }
      #statementSheet, #statementSheet * { visibility: visible; }
      #statementSheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 100%;
        box-shadow: none;
        background: #ffffff !important;
        color: #111827 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ZONE 1: Top Header & Hero Balance -->
    <div class="top-zone">
      <header class="top-bar">
        <div class="wallet-title-group">
          <div class="wallet-heading-row">
            <h1 class="wallet-title" data-i18n="walletTitle">Wallet</h1>
            <div class="mini-totals" id="miniTotalsBadge">
              <span class="val-eur" id="totalEurMini">€0.00</span>
              <span>•</span>
              <span class="val-bdt" id="totalBdtMini">৳0</span>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn lang-badge-btn" id="quickLangBtn" title="Switch Language">EN</button>
          <button class="icon-btn" id="quickThemeBtn" title="Switch Theme">🎨</button>
          <button class="icon-btn" id="settingsBtn" title="Wallet Settings" aria-label="Wallet Settings">⚙️</button>
        </div>
      </header>

      <section class="hero-section">
        <div class="hero-label" id="activeCardLabel">MAIN CARD</div>
        <div class="hero-balance" id="heroBalanceDisplay">€0.00</div>
        <div class="action-row">
          <button class="pill-btn pill-add" id="openAddBtn" data-i18n="btnAdd">+ Add</button>
          <button class="pill-btn pill-expense" id="openExpenseBtn" data-i18n="btnExpense">− Expense</button>
          <button class="pill-btn pill-transfer" id="openTransferBtn" data-i18n="btnTransfer">⇄ Transfer</button>
        </div>
      </section>
    </div>

    <!-- ZONE 2: Middle Dedicated Card Carousel Zone -->
    <section class="cards-wrapper">
      <div class="cards-carousel" id="cardsCarousel"></div>
      <div class="card-dots" id="cardDots"></div>
    </section>

    <!-- ZONE 3: Bottom Stable Activity Zone -->
    <div class="activity-zone">
      <div class="section-header">
        <span class="section-title" data-i18n="recentActivity">Recent Activity</span>
        <div class="month-pill">
          <span class="month-in" id="monthInVal">+€0</span>
          <span class="month-out" id="monthOutVal">−€0</span>
        </div>
      </div>

      <div class="activity-filter-bar">
        <button class="filter-tab active" data-filter="all" data-i18n="allCards">All Cards</button>
        <button class="filter-tab" data-filter="selected" id="selectedCardFilterBtn">Selected Card</button>
      </div>

      <div class="home-search-row">
        <div class="home-search-box">
          <span class="home-search-icon">🔍</span>
          <input type="text" class="home-search-input" id="homeSearchInput" placeholder="Search note or category..." />
          <button class="home-search-clear" id="homeSearchClear" aria-label="Clear search">✕</button>
        </div>
        <select class="home-cat-select" id="homeCatFilter">
          <option value="all">All Categories</option>
        </select>
      </div>

      <div class="tx-list" id="txList"></div>
    </div>
  </div>

  <!-- Quick Theme & Language Picker Bottom Sheet -->
  <div class="modal-backdrop" id="appearanceBackdrop">
    <div class="bottom-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 style="font-size:18px;font-weight:800;" data-i18n="appearanceTitle">Theme & Language</h3>
        <button class="icon-btn" id="closeAppearanceBtn">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="chooseTheme">Choose App Theme</label>
        <div class="theme-grid" id="quickThemeGrid"></div>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label" data-i18n="chooseLang">Choose Language</label>
        <div class="lang-grid" id="quickLangGrid"></div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Add / Expense / Transfer / Edit Screen -->
  <div class="overlay-screen" id="entryOverlay">
    <div class="overlay-top">
      <button class="icon-btn" id="closeEntryBtn" aria-label="Close">✕</button>
      <span class="overlay-title" id="entryModeTitle">Add Money</span>
      <span style="width:38px"></span>
    </div>

    <div class="cat-strip" id="catStrip"></div>

    <div class="transfer-bar" id="transferBar">
      <div class="transfer-box-card">
        <div class="transfer-row">
          <div>
            <label class="form-label" data-i18n="toCard">To Card (Receiver)</label>
            <select class="form-select" id="transferToSelect"></select>
          </div>
          <div id="chargeModeContainer">
            <label class="form-label" data-i18n="chargeType">Charge Type</label>
            <select class="form-select" id="chargeModeSelect">
              <option value="deduct_from_amount" data-i18n="inclusiveCharge">Inclusive (Fee included)</option>
              <option value="add_to_amount" data-i18n="exclusiveCharge">Exclusive (Amount + Fee)</option>
            </select>
          </div>
        </div>

        <div class="transfer-row" id="fxRateFieldsContainer">
          <div>
            <label class="form-label" id="fxRateLabel">Exchange Rate (1 EUR = ?)</label>
            <input type="number" step="any" class="form-input" id="manualRateInput" value="130" placeholder="130" />
          </div>
          <div>
            <label class="form-label" data-i18n="serviceCharge">Service Charge</label>
            <input type="number" step="any" class="form-input" id="manualFeeInput" value="2" placeholder="2.00" />
          </div>
        </div>

        <div class="fx-summary-box" id="transferFxSummary"></div>
      </div>
    </div>

    <div class="amount-stage">
      <div class="native-amount-wrapper">
        <span class="native-sym" id="entryCurrencySym">€</span>
        <input type="number" step="any" inputmode="decimal" class="native-amount-input" id="nativeAmountInput" placeholder="0" autofocus />
      </div>
      <input type="text" class="note-input" id="entryNoteInput" placeholder="Add a note (optional)..." />
    </div>

    <div class="presets-row" id="presetsRow"></div>

    <button class="send-cta" id="submitTxBtn">Send</button>
  </div>

  <!-- Transaction Action Sheet (Edit / Delete) -->
  <div class="modal-backdrop" id="txActionBackdrop">
    <div class="bottom-sheet">
      <div class="action-sheet-header">
        <div class="tx-avatar" id="txActionIcon">💳</div>
        <div style="flex:1;min-width:0;">
          <div id="txActionTitle" style="font-size:16px;font-weight:800;">Transaction</div>
          <div id="txActionSub" style="font-size:12.5px;color:var(--text-secondary);">Details</div>
        </div>
        <button class="icon-btn" id="closeTxActionBtn">✕</button>
      </div>

      <button class="action-sheet-btn edit-btn" id="txActionEditBtn" data-i18n="editTxBtn">✏️ Edit Transaction</button>
      <button class="action-sheet-btn delete-btn" id="txActionDeleteBtn" data-i18n="deleteTxBtn">🗑️ Delete Transaction</button>
    </div>
  </div>

  <!-- Confirmation Animation Bottom Sheet -->
  <div class="modal-backdrop" id="confirmBackdrop">
    <div class="bottom-sheet">
      <div class="confirm-stage" id="confirmStage">
        <div class="ring-wrapper">
          <div class="spinner-ring" id="confirmSpinner"></div>
          <div class="ring-avatar" id="confirmAvatar">💸</div>
        </div>
        <div class="confirm-title" id="confirmTitle">Processing...</div>
        <div class="confirm-sub" id="confirmSub">Updating card balance</div>
      </div>
    </div>
  </div>

  <!-- Custom Category Bottom Sheet -->
  <div class="modal-backdrop" id="customCatBackdrop">
    <div class="bottom-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 style="font-size:18px;font-weight:800;" data-i18n="newCatTitle">New Category</h3>
        <button class="icon-btn" id="closeCustomCatBtn">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="catNameLabel">Category Name</label>
        <input type="text" class="form-input" id="newCatName" placeholder="e.g., Coffee, Metro, Remittance..." />
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="pickIconLabel">Pick an Icon</label>
        <div class="icon-grid" id="iconPickerGrid"></div>
      </div>
      <button class="send-cta" style="width:100%;margin:10px 0 0;" id="saveCustomCatBtn" data-i18n="createCatBtn">Create Category</button>
    </div>
  </div>

  <!-- Card Statement Modal -->
  <div class="modal-backdrop" id="statementBackdrop">
    <div class="bottom-sheet" id="statementSheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div>
          <h3 id="stmtCardTitle" style="font-size:18px;font-weight:800;">Card Statement</h3>
          <div id="stmtCardBal" style="font-size:12.5px;font-weight:700;color:var(--emerald);">Current Balance: €0.00</div>
        </div>
        <div class="no-print" style="display:flex;gap:8px;">
          <button class="pill-btn pill-add" style="padding:8px 12px;font-size:12px;" id="downloadPdfBtn">📄 PDF</button>
          <button class="icon-btn" id="closeStmtBtn">✕</button>
        </div>
      </div>
