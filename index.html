<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PocketFlow" />
  <meta name="theme-color" id="metaThemeColor" content="#f5f6f8" />
  <title>PocketFlow — Personal Card & Expense Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f5f6f8;
      --bg-card: #ffffff;
      --bg-subtle: #eceef2;
      --bg-input: #f0f2f5;
      --text-primary: #14171f;
      --text-secondary: #687082;
      --text-muted: #98a0b0;
      --border-color: rgba(20, 23, 31, 0.08);
      --accent-dark: #14171f;
      --accent-dark-text: #ffffff;
      --emerald: #10b981;
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --shadow-sm: 0 2px 10px rgba(17, 24, 39, 0.04);
      --shadow-md: 0 10px 28px rgba(17, 24, 39, 0.08);
      --shadow-lg: 0 20px 48px rgba(17, 24, 39, 0.14);
      --theme-transition: background-color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                          color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                          border-color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                          box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html.dark, body.dark {
      --bg-app: #0f1218;
      --bg-card: #181c26;
      --bg-subtle: #212734;
      --bg-input: #1d222e;
      --text-primary: #eef1f6;
      --text-secondary: #929bae;
      --text-muted: #626b7e;
      --border-color: rgba(255, 255, 255, 0.07);
      --accent-dark: #eef1f6;
      --accent-dark-text: #0f1218;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.22);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.34);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      width: 100%;
      overflow-x: hidden;
      transition: var(--theme-transition);
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: var(--bg-app);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
      transition: var(--theme-transition);
    }

    /* Top Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 20px 10px;
      gap: 8px;
    }

    .wallet-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .wallet-heading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .wallet-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .mini-totals {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: var(--theme-transition);
    }

    .mini-totals span.val-eur {
      color: var(--text-primary);
      font-weight: 700;
    }

    .mini-totals span.val-bdt {
      color: var(--emerald);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), var(--theme-transition);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .theme-icon-spin {
      display: inline-block;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.dark .theme-icon-spin {
      transform: rotate(180deg);
    }

    /* Active Card Hero Balance */
    .hero-section {
      padding: 12px 20px 16px;
      text-align: center;
    }

    .hero-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero-balance {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 4px 0 16px;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), var(--theme-transition);
    }

    .pill-btn:active {
      transform: scale(0.94);
    }

    .pill-add {
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      box-shadow: var(--shadow-md);
    }

    .pill-expense {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .pill-transfer {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    /* Premium Cards Carousel (inspired by Revolut physical card styling in image_7.png) */
    .cards-wrapper {
      padding: 6px 0 8px;
    }

    .cards-carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 20px 14px;
      scrollbar-width: none;
    }

    .cards-carousel::-webkit-scrollbar {
      display: none;
    }

    .wallet-card {
      flex: 0 0 calc(100% - 24px);
      max-width: 360px;
      height: 198px;
      border-radius: 20px;
      padding: 20px 22px;
      color: #ffffff;
      scroll-snap-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .wallet-card:active {
      transform: scale(0.975);
    }

    /* Metallic lighting and reflections based on the Revolut style */
    .wallet-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 40%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.25) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Dynamic shimmering glare overlay */
    .wallet-card .glare-shine {
      position: absolute;
      top: -150%;
      left: -50%;
      width: 200%;
      height: 300%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
      transform: rotate(-30deg);
      pointer-events: none;
      z-index: 1;
    }

    .wallet-card.glow-success {
      box-shadow: 0 0 0 3px var(--emerald), 0 14px 36px rgba(16, 185, 129, 0.32);
    }

    /* Micro EMV Chip Design */
    .card-chip {
      width: 36px;
      height: 27px;
      background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 40%, #aa771c 80%, #ffd700 100%);
      border-radius: 5px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 0 1.5px 3px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }
    
    .card-chip::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 3px;
      background: linear-gradient(to right, transparent 48%, rgba(0,0,0,0.15) 48%, rgba(0,0,0,0.15) 52%, transparent 52%),
                  linear-gradient(to bottom, transparent 48%, rgba(0,0,0,0.15) 48%, rgba(0,0,0,0.15) 52%, transparent 52%);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .card-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.015em;
      opacity: 0.95;
    }

    .card-brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.03em;
      opacity: 0.9;
    }

    .card-currency-pill {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .card-mid {
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .card-bal-label {
      font-size: 10.5px;
      opacity: 0.72;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-bal-val {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1.5px 3px rgba(0,0,0,0.25);
    }

    .card-contactless {
      opacity: 0.75;
      font-size: 16px;
      transform: rotate(90deg) scaleY(-1);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.05em;
      z-index: 2;
      opacity: 0.9;
    }

    .card-network-logo {
      font-weight: 800;
      font-style: italic;
      font-size: 15px;
      letter-spacing: -0.05em;
      opacity: 0.95;
      text-shadow: 0 1px 1px rgba(0,0,0,0.15);
    }

    .card-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 2px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--text-muted);
      opacity: 0.35;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .dot.active {
      width: 18px;
      background: var(--text-primary);
      opacity: 1;
    }

    /* Monthly Summary & Activity */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 8px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
    }

    .activity-filter-bar {
      display: flex;
      gap: 8px;
      padding: 0 20px 10px;
    }

    .filter-tab {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--theme-transition);
    }

    .filter-tab.active {
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      border-color: var(--accent-dark);
      box-shadow: var(--shadow-sm);
    }

    .month-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      transition: var(--theme-transition);
    }

    .month-in {
      color: var(--emerald);
    }

    .month-out {
      color: var(--danger);
    }

    .tx-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      animation: slideUpFade 0.35s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      transition: transform 0.16s ease, var(--theme-transition);
    }

    .tx-item:active {
      transform: scale(0.98);
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--bg-subtle);
      transition: var(--theme-transition);
    }

    .tx-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tx-cat {
      font-size: 14px;
      font-weight: 700;
    }

    .tx-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .tx-amount {
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .tx-amount.add {
      color: var(--emerald);
    }

    .tx-amount.expense {
      color: var(--text-primary);
    }

    .tx-amount.transfer {
      color: var(--blue);
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 22px;
      transition: var(--theme-transition);
    }

    /* Fullscreen Slide-up Entry Overlay */
    .overlay-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-app);
      z-index: 100;
      display: flex;
      flex-direction: column;
      max-width: 440px;
      margin: 0 auto;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.45s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    .overlay-screen.open {
      transform: translateY(0);
    }

    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      position: relative;
      z-index: 102;
    }

    .overlay-title {
      font-size: 16px;
      font-weight: 700;
    }

    /* Category Bar */
    .cat-strip {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 20px 14px;
      scrollbar-width: none;
    }

    .cat-strip::-webkit-scrollbar {
      display: none;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .cat-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, var(--theme-transition);
    }

    .cat-item.selected .cat-circle {
      border-color: var(--text-primary);
      transform: scale(1.08);
      background: var(--bg-subtle);
    }

    .cat-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cat-item.selected .cat-label {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Transfer Manual Exchange Rate & Charge Mode Controls */
    .transfer-bar {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 6px 20px 12px;
    }

    .transfer-bar.visible {
      display: flex;
    }

    .transfer-box-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .transfer-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .transfer-row .form-input, .transfer-row .form-select {
      flex: 1;
      min-width: 0;
    }

    .fx-summary-box {
      background: var(--bg-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    /* Native Amount Input Stage */
    .amount-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
    }

    .native-amount-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 24px;
      padding: 12px 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, var(--theme-transition);
    }

    .native-amount-wrapper:focus-within {
      border-color: var(--emerald);
    }

    .native-sym {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .native-amount-input {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .note-input {
      margin-top: 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13.5px;
      color: var(--text-primary);
      text-align: center;
      width: 85%;
      max-width: 290px;
      outline: none;
      transition: var(--theme-transition);
    }

    /* Preset Pills */
    .presets-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 6px 16px 14px;
      flex-wrap: wrap;
    }

    .preset-chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.14s ease, var(--theme-transition);
    }

    .preset-chip:active {
      transform: scale(0.92);
    }

    .send-cta {
      margin: 10px 20px 20px;
      height: 54px;
      border-radius: 18px;
      border: none;
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: transform 0.16s ease, var(--theme-transition);
    }

    .send-cta:active {
      transform: scale(0.97);
    }

    /* Confirmation Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 15, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 150;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .bottom-sheet {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border-radius: 30px 30px 0 0;
      padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-lg);
      animation: sheetRise 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 88vh;
      overflow-y: auto;
      transition: var(--theme-transition);
    }

    @keyframes sheetRise {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .confirm-stage {
      text-align: center;
      padding: 18px 10px;
      position: relative;
    }

    .ring-wrapper {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3.5px solid var(--bg-subtle);
      border-top-color: var(--emerald);
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .ring-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ring-avatar.done {
      background: var(--emerald);
      color: #ffffff;
      transform: scale(1.06);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .ring-avatar.declined {
      background: var(--danger);
      color: #ffffff;
      transform: scale(1.06);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
    }

    .confirm-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .confirm-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .confetti-piece {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      top: 48px;
      left: 50%;
      pointer-events: none;
      animation: confettiFly 0.75s ease-out forwards;
    }

    @keyframes confettiFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(240deg) scale(0.4); opacity: 0; }
    }

    /* Settings & Statement Controls */
    .tabs-bar {
      display: flex;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--theme-transition);
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: var(--theme-transition);
    }

    .form-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .form-row .form-input, .form-row .form-select {
      flex: 1;
      min-width: 0;
    }

    .color-swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .swatch {
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
    }

    .swatch::after {
      content: attr(data-name);
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      display: none;
    }

    .swatch.active {
      border-color: var(--text-primary);
      transform: scale(1.08);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-height: 170px;
      overflow-y: auto;
      padding: 4px;
    }

    .icon-choice {
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: var(--bg-input);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, var(--theme-transition);
    }

    .icon-choice.active {
      border-color: var(--text-primary);
      background: var(--bg-subtle);
      transform: scale(1.06);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-dark);
      color: var(--accent-dark-text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: var(--danger);
      color: #fff;
    }

    .toast-undo {
      background: var(--emerald);
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Print / PDF Statement Styles */
    @media print {
      body * { visibility: hidden; }
      #statementSheet, #statementSheet * { visibility: visible; }
      #statementSheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 100%;
        box-shadow: none;
        background: #ffffff !important;
        color: #111827 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>

  <script>
    const CURRENCY_META = {
      EUR: { symbol: '€', rateToEur: 1 },
      USD: { symbol: '$', rateToEur: 0.92 },
      BDT: { symbol: '৳', rateToEur: 0.0077 },
      JPY: { symbol: '¥', rateToEur: 0.0061 },
      GBP: { symbol: '£', rateToEur: 1.17 },
      CHF: { symbol: 'CHF ', rateToEur: 1.06 }
    };

    // Card premium gradients directly referencing the materials from the provided screenshot image_7.png
    const CARD_DESIGNS = [
      { name: "Metal Bronze", grad: "linear-gradient(135deg, #a87e53 0%, #d4b58c 30%, #7d5b32 70%, #9e754a 100%)", defaultNetwork: "VISA" },
      { name: "Metal Nera", grad: "linear-gradient(135deg, #2b2b2b 0%, #171717 30%, #404040 70%, #0d0d0d 100%)", defaultNetwork: "VISA" },
      { name: "Metal Oro", grad: "linear-gradient(135deg, #e5c158 0%, #fff0b3 30%, #b8860b 70%, #d4af37 100%)", defaultNetwork: "VISA" },
      { name: "Standard (Graffit)", grad: "linear-gradient(135deg, #2b3a8d 0%, #632284 35%, #921966 70%, #512275 100%)", defaultNetwork: "VISA" },
      { name: "Cromata (Iridescent)", grad: "linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 20%, #c2ffd8 45%, #f9ffd2 70%, #ffcfd2 100%)", defaultNetwork: "Mastercard" },
      { name: "Plus", grad: "linear-gradient(135deg, #321e84 0%, #7d1c69 35%, #b42b5a 65%, #2a1b73 100%)", defaultNetwork: "VISA" },
      { name: "Slate Grey", grad: "linear-gradient(135deg, #606d7d 0%, #7a8a9e 30%, #44505c 70%, #52606f 100%)", defaultNetwork: "VISA" },
      { name: "Blu Notte", grad: "linear-gradient(135deg, #1b263b 0%, #2a3c5a 30%, #0d1b2a 75%, #192a46 100%)", defaultNetwork: "VISA" },
      { name: "Sage Green", grad: "linear-gradient(135deg, #6b8c80 0%, #8fb4a6 30%, #4a6358 70%, #5a7b6e 100%)", defaultNetwork: "Mastercard" }
    ];

    const ICON_LIBRARY = [
      '🎯', '⛽', '🏋️', '🍕', '✈️', '🏠',
      '📱', '🎓', '💇', '🐾', '🏥', '🎉',
      '🛒', '☕', '🍽️', '🚆', '📶', '💸',
      '🎁', '👕', '✂️', '💊', '💡', '🏦',
      '💰', '📦', '🎬', '🛡️', '🧾', '🌍'
    ];

    const DEFAULT_CATEGORIES = [
      { id: 'food', name: 'Food', icon: '🍔' },
      { id: 'coffee', name: 'Coffee', icon: '☕' },
      { id: 'grocery', name: 'Grocery', icon: '🛒' },
      { id: 'transport', name: 'Metro', icon: '🚆' },
      { id: 'shopping', name: 'Shopping', icon: '🛍️' },
      { id: 'bills', name: 'Bills', icon: '⚡' },
      { id: 'remit', name: 'Remit', icon: '💸' },
      { id: 'salary', name: 'Salary', icon: '💰' }
    ];

    const STORAGE_KEY = 'pocketflow_wallet_v7';

    function getDefaultState() {
      return {
        darkMode: false,
        cards: [
          {
            id: 'card_1',
            name: 'Metal Bronze',
            digits: '4568',
            currency: 'EUR',
            balance: 50000.00,
            gradient: CARD_DESIGNS[0].grad,
            network: "VISA"
          },
          {
            id: 'card_2',
            name: 'Sage Green',
            digits: '8824',
            currency: 'BDT',
            balance: 100,
            gradient: CARD_DESIGNS[8].grad,
            network: "Mastercard"
          }
        ],
        categories: [...DEFAULT_CATEGORIES],
        transactions: []
      };
    }

    let state = loadState();
    let activeCardIndex = 0;
    let homeActivityFilter = 'all';
    let entryMode = 'add';
    let selectedCatId = state.categories[0]?.id || 'food';
    let selectedGradient = CARD_DESIGNS[0].grad;
    let selectedNetwork = "VISA";
    let selectedNewIcon = ICON_LIBRARY[0];
    let statementCardId = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.cards) && parsed.cards.length > 0) {
            return parsed;
          }
        }
      } catch (e) {}
      return getDefaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    function formatMoney(amount, currencyCode) {
      const meta = CURRENCY_META[currencyCode] || CURRENCY_META.EUR;
      const num = Number(amount) || 0;
      const decimals = currencyCode === 'JPY' || currencyCode === 'BDT' ? 0 : 2;
      return `${meta.symbol}${num.toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      })}`;
    }

    function applyTheme() {
      const isDark = !!state.darkMode;
      document.documentElement.classList.toggle('dark', isDark);
      document.body.classList.toggle('dark', isDark);
      const iconSpan = document.getElementById('themeIconSpan');
      if (iconSpan) iconSpan.textContent = isDark ? '☀️' : '🌙';
      const metaTheme = document.getElementById('metaThemeColor');
      if (metaTheme) {
        metaTheme.setAttribute('content', isDark ? '#0f1218' : '#f5f6f8');

    function updateHeaderTotals() {
      let totalEur = 0;
      let totalBdt = 0;

      if (!state.cards || !Array.isArray(state.cards)) return;

      state.cards.forEach(c => {
        const bal = Number(c.balance) || 0;
        if (c.currency === 'BDT') {
          totalBdt += bal;
        } else {
          const rate = (CURRENCY_META[c.currency] || CURRENCY_META.EUR).rateToEur;
          totalEur += bal * rate;
        }
      });

      document.getElementById('totalEurMini').textContent = `€${totalEur.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      document.getElementById('totalBdtMini').textContent = `৳${totalBdt.toLocaleString('en-US', { maximumFractionDigits: 0 })}`;

    function updateHeroForActiveCard() {
      if (!state.cards || state.cards.length === 0) return;
      const card = state.cards[activeCardIndex] || state.cards[0];
      if (!card) return;
      document.getElementById('activeCardLabel').textContent = `${card.name} ••${card.digits}`;
      document.getElementById('heroBalanceDisplay').textContent = formatMoney(card.balance, card.currency);
      document.getElementById('selectedCardFilterBtn').textContent = `${card.name} Only`;
      document.querySelectorAll('#cardDots .dot').forEach((d, i) => {
        d.classList.toggle('active', i === activeCardIndex);
      });
    }

    function renderTransactions() {
      const list = document.getElementById('txList');
      if (!list) return;
      list.innerHTML = '';

      if (!state.cards || state.cards.length === 0) return;
      const activeCard = state.cards[activeCardIndex] || state.cards[0];
      const now = new Date();
      let monthIn = 0;
      let monthOut = 0;

      const filteredTxs = (state.transactions || []).filter(tx => {
        if (homeActivityFilter === 'selected') return tx.cardId === activeCard.id || tx.toCardId === activeCard.id;
        return true;
      });

      filteredTxs.forEach(tx => {
        const d = new Date(tx.date);
        if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
          if (tx.cardId === activeCard.id) {
            if (tx.type === 'add') monthIn += Number(tx.amount);
            if (tx.type === 'expense' || tx.type === 'transfer') monthOut += Number(tx.totalDeducted || tx.amount);
          }
        }
      });

      const sym = (CURRENCY_META[activeCard.currency] || CURRENCY_META.EUR).symbol;
      document.getElementById('monthInVal').textContent = `+${sym}${monthIn.toFixed(0)}`;
      document.getElementById('monthOutVal').textContent = `−${sym}${monthOut.toFixed(0)}`;

      if (filteredTxs.length === 0) {
        list.innerHTML = `<div class="empty-state">No transactions found. Tap <strong>+ Add</strong> or <strong>− Expense</strong> above.</div>`;
        return;
      }

      filteredTxs.slice(0, 25).forEach((tx, index) => {
        const card = state.cards.find(c => c.id === tx.cardId) || activeCard;
        const cat = state.categories.find(c => c.id === tx.categoryId) || { name: tx.categoryName || 'Entry', icon: tx.icon || '💳' };
        const dateStr = new Date(tx.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        
        let displayAmtStr = '';
        let prefix = '';
        let amountClass = tx.type;

        if (tx.type === 'add') {
          prefix = '+';
          displayAmtStr = formatMoney(tx.amount, card.currency);
        } else if (tx.type === 'expense') {
          prefix = '−';
          displayAmtStr = formatMoney(tx.amount, card.currency);
        } else if (tx.type === 'transfer') {
          const toCard = state.cards.find(c => c.id === tx.toCardId);
          prefix = '⇄ ';
          displayAmtStr = `${formatMoney(tx.totalDeducted || tx.amount, card.currency)} ➔ ${formatMoney(tx.convertedAmount, toCard ? toCard.currency : card.currency)}`;
          amountClass = 'transfer';
        }

        const row = document.createElement('div');
        row.className = 'tx-item';
        row.style.animationDelay = `${index * 0.03}s`;
        row.innerHTML = `
          <div class="tx-left">
            <div class="tx-avatar">${cat.icon}</div>
            <div class="tx-meta">
              <div class="tx-cat">${cat.name}${tx.note ? ` · <span style="font-weight:500;color:var(--text-secondary)">${tx.note}</span>` : ''}</div>
              <div class="tx-sub">${card.name} • ${dateStr}</div>
            </div>
          </div>
          <div class="tx-amount ${amountClass}" style="font-size:13.5px;">${prefix}${displayAmtStr}</div>
        `;
        row.addEventListener('click', () => deleteTransactionWithUndo(tx.id));
        list.appendChild(row);
      });
    }

    function deleteTransactionWithUndo(txId) {
      const idx = state.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = state.transactions[idx];
      if (!confirm(`Delete transaction "${tx.categoryName}"?`)) return;

      const card = state.cards.find(c => c.id === tx.cardId);
      if (card) {
        if (tx.type === 'add') {
          card.balance = Math.max(0, Number(card.balance) - Number(tx.amount));
        } else if (tx.type === 'expense') {
          card.balance = Number(card.balance) + Number(tx.amount);
        } else if (tx.type === 'transfer') {
          card.balance = Number(card.balance) + Number(tx.totalDeducted);
          const toCard = state.cards.find(c => c.id === tx.toCardId);
          if (toCard) {
            toCard.balance = Math.max(0, Number(toCard.balance) - Number(tx.convertedAmount));
          }
        }
      }

      state.transactions.splice(idx, 1);
      saveState();
      refreshAll();
      showToast('Transaction deleted and balances reversed', true);
    }

    function openEntryOverlay(mode) {
      triggerHaptic();
      entryMode = mode;
      document.getElementById('nativeAmountInput').value = '';
      document.getElementById('entryNoteInput').value = '';

      const card = state.cards[activeCardIndex] || state.cards[0];
      const sym = (CURRENCY_META[card.currency] || CURRENCY_META.EUR).symbol;
      document.getElementById('entryCurrencySym').textContent = sym;

      }, 300);
    }

    function updateTransferLiveCalculation() {
      const amount = parseFloat(document.getElementById('nativeAmountInput').value) || 0;
      const fromCard = state.cards[activeCardIndex] || state.cards[0];
      const toCardId = document.getElementById('transferToSelect').value;
      const toCard = state.cards.find(c => c.id === toCardId) || state.cards.find((c, i) => i !== activeCardIndex);
      const summaryBox = document.getElementById('transferFxSummary');
      const fxFieldsContainer = document.getElementById('fxRateFieldsContainer');
      const chargeModeContainer = document.getElementById('chargeModeContainer');

      const isSameCurrency = toCard && fromCard.currency === toCard.currency;

      if (isSameCurrency) {
        fxFieldsContainer.style.display = 'none';
        chargeModeContainer.style.display = 'none';
        const sym = (CURRENCY_META[fromCard.currency] || CURRENCY_META.EUR).symbol;
        summaryBox.innerHTML = `
          <div>🔄 <strong>Direct Transfer (${fromCard.currency} to ${fromCard.currency}):</strong> No exchange rate or conversion fee.</div>
          <div>🎯 <strong>${toCard.name} will receive:</strong> ${sym}${amount.toFixed(2)} exact.</div>
        `;
      } else {
        fxFieldsContainer.style.display = 'flex';
        chargeModeContainer.style.display = 'block';

        const rate = parseFloat(document.getElementById('manualRateInput').value) || 130;
        const fee = parseFloat(document.getElementById('manualFeeInput').value) || 0;
        const chargeMode = document.getElementById('chargeModeSelect').value;
        const toCurr = toCard ? toCard.currency : 'BDT';
        const toSym = (CURRENCY_META[toCurr] || CURRENCY_META.BDT).symbol;
        const fromSym = (CURRENCY_META[fromCard.currency] || CURRENCY_META.EUR).symbol;

        document.getElementById('fxRateLabel').textContent = `Exchange Rate (1 ${fromCard.currency} = ?)`;

        let netPrincipal = amount;
        let totalDeducted = amount;
        let targetReceived = 0;

        if (chargeMode === 'deduct_from_amount') {
          netPrincipal = Math.max(0, amount - fee);
          totalDeducted = amount;
          targetReceived = netPrincipal * rate;
        } else {
          netPrincipal = amount;
          totalDeducted = amount + fee;
          targetReceived = netPrincipal * rate;
        }

        summaryBox.innerHTML = `
          <div>💱 <strong>Exchange Rate:</strong> 1 ${fromCard.currency} = ${rate} ${toCurr}</div>
          <div>💸 <strong>Total Deducted from ${fromCard.name}:</strong> ${fromSym}${totalDeducted.toFixed(2)} (${chargeMode === 'deduct_from_amount' ? 'Inclusive' : 'Exclusive'} Fee: ${fromSym}${fee.toFixed(2)})</div>
          <div>🎯 <strong>${toCard ? toCard.name : 'Receiver'} Gets:</strong> ${toSym}${targetReceived.toLocaleString('en-US', {maximumFractionDigits:0})}</div>
        `;
      }
    }

    document.getElementById('nativeAmountInput')?.addEventListener('input', updateTransferLiveCalculation);
    document.getElementById('manualRateInput')?.addEventListener('input', updateTransferLiveCalculation);
    document.getElementById('manualFeeInput')?.addEventListener('input', updateTransferLiveCalculation);
    document.getElementById('chargeModeSelect')?.addEventListener('change', updateTransferLiveCalculation);
    document.getElementById('transferToSelect')?.addEventListener('change', updateTransferLiveCalculation);

    function spawnConfetti() {
      const stage = document.getElementById('confirmStage');
      if (!stage) return;
      const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'];
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-piece';
        const angle = (Math.PI * 2 * i) / 16;
        const dist = 55 + Math.random() * 45;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist - 15}px`);
        p.style.background = colors[i % colors.length];
        stage.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function submitTransaction() {
      const amountVal = document.getElementById('nativeAmountInput').value;
      const amount = parseFloat(amountVal);
      if (!amount || amount <= 0) {
        showToast('Please enter a valid amount greater than 0', true);
        return;
      }

      const card = state.cards[activeCardIndex] || state.cards[0];
      const cat = state.categories.find(c => c.id === selectedCatId) || state.categories[0];
      const note = document.getElementById('entryNoteInput').value.trim();

      let totalDeducted = amount;
      let convertedAmount = amount;
      let transferFee = 0;
      let toCardId = null;

      if (entryMode === 'transfer') {
        toCardId = document.getElementById('transferToSelect').value;
        const toCard = state.cards.find(c => c.id === toCardId);
        const isSameCurrency = toCard && card.currency === toCard.currency;

        if (isSameCurrency) {
          totalDeducted = amount;
          convertedAmount = amount;
        } else {
          const rate = parseFloat(document.getElementById('manualRateInput').value) || 130;
          transferFee = parseFloat(document.getElementById('manualFeeInput').value) || 0;
          const chargeMode = document.getElementById('chargeModeSelect').value;

          if (chargeMode === 'deduct_from_amount') {
            const netSource = Math.max(0, amount - transferFee);
            totalDeducted = amount;
            convertedAmount = netSource * rate;
          } else {
            totalDeducted = amount + transferFee;
            convertedAmount = amount * rate;
          }
        }
      }

      // INSUFFICIENT BALANCE CHECK
      if ((entryMode === 'expense' || entryMode === 'transfer') && Number(card.balance) < totalDeducted) {
        triggerHaptic();
        const backdrop = document.getElementById('confirmBackdrop');
        const spinner = document.getElementById('confirmSpinner');
        const avatar = document.getElementById('confirmAvatar');
        const title = document.getElementById('confirmTitle');
        const sub = document.getElementById('confirmSub');

        spinner.style.display = 'none';
        avatar.className = 'ring-avatar declined';
        avatar.textContent = '✕';
        title.textContent = 'Transaction Declined';
        sub.textContent = `Insufficient balance! Available: ${formatMoney(card.balance, card.currency)}`;
        backdrop.classList.add('open');

        setTimeout(() => {
          backdrop.classList.remove('open');
          avatar.className = 'ring-avatar';
        }, 2200);

        showToast('Insufficient balance!', true);
        return;
      }

      if (entryMode === 'transfer' && state.cards.length < 2) {
        showToast('Create at least 2 cards to transfer', true);
        return;
      }

      const backdrop = document.getElementById('confirmBackdrop');
      const spinner = document.getElementById('confirmSpinner');
      const avatar = document.getElementById('confirmAvatar');
      const title = document.getElementById('confirmTitle');
      const sub = document.getElementById('confirmSub');

      spinner.style.display = 'block';
      avatar.className = 'ring-avatar';
      avatar.textContent = entryMode === 'transfer' ? '⇄' : cat.icon;
      title.textContent = entryMode === 'add' ? 'Adding Funds...' : entryMode === 'expense' ? 'Sending Expense...' : 'Transferring...';
      sub.textContent = `${formatMoney(totalDeducted, card.currency)} • ${card.name}`;
      backdrop.classList.add('open');

      setTimeout(() => {
        triggerHaptic();
        spinner.style.display = 'none';
        avatar.classList.add('done');
        avatar.textContent = '✓';
        spawnConfetti();

        if (entryMode === 'add') {
          card.balance = Number(card.balance) + amount;
        } else if (entryMode === 'expense') {
          card.balance = Math.max(0, Number(card.balance) - amount);
        } else if (entryMode === 'transfer') {
          card.balance = Math.max(0, Number(card.balance) - totalDeducted);
          const toCard = state.cards.find(c => c.id === toCardId);
          if (toCard) {
            toCard.balance = Number(toCard.balance) + convertedAmount;
          }
        }

        state.transactions.unshift({
          id: 'tx_' + Date.now(),
          cardId: card.id,
          toCardId,
          sourceAmount: amount,
          convertedAmount,
          transferFee,
          totalDeducted,
          type: entryMode,
          categoryId: cat.id,
          categoryName: entryMode === 'transfer' ? 'Card Transfer' : cat.name,
          icon: entryMode === 'transfer' ? '⇄' : cat.icon,
          amount: entryMode === 'transfer' ? totalDeducted : amount,
          currency: card.currency,
          note,
          date: new Date().toISOString()
        });

        saveState();
        title.textContent = 'Completed!';
        sub.textContent = `New Balance: ${formatMoney(card.balance, card.currency)}`;

        setTimeout(() => {
          backdrop.classList.remove('open');
          document.getElementById('entryOverlay').classList.remove('open');
          refreshAll();

          const cardEl = document.querySelector(`.wallet-card[data-card-id="${card.id}"]`);
          if (cardEl) {
            cardEl.classList.add('glow-success');
            setTimeout(() => cardEl.classList.remove('glow-success'), 1100);
          }
        }, 700);
      }, 650);
    }

    function renderStatementTransactions() {
      const list = document.getElementById('stmtTxList');
      if (!list) return;
      list.innerHTML = '';
      const card = state.cards.find(c => c.id === statementCardId);
      if (!card) return;

      const fromDate = document.getElementById('stmtFromDate').value;
      const toDate = document.getElementById('stmtToDate').value;
      const query = document.getElementById('stmtSearchInput').value.trim().toLowerCase();
      const typeFilter = document.getElementById('stmtTypeFilter').value;

      const filtered = (state.transactions || []).filter(tx => {
        if (tx.cardId !== card.id && tx.toCardId !== card.id) return false;
        if (typeFilter !== 'all' && tx.type !== typeFilter) return false;
        const txDay = tx.date.slice(0, 10);
        if (fromDate && txDay < fromDate) return false;
        if (toDate && txDay > toDate) return false;
        if (query) {
          const hay = `${tx.categoryName} ${tx.note || ''}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      let filteredTotal = 0;
      filtered.forEach(tx => {
        const isIncoming = tx.type === 'transfer' && tx.toCardId === card.id;
        filteredTotal += Number(isIncoming ? tx.convertedAmount : (tx.totalDeducted || tx.amount)) || 0;
      });

      const labels = { all: 'All Transactions Total', add: 'Total Added', expense: 'Total Expense', transfer: 'Total Transfer' };
      document.getElementById('stmtSummaryLabel').textContent = labels[typeFilter] || 'Filtered Total:';
      document.getElementById('stmtSummaryVal').textContent = formatMoney(filteredTotal, card.currency);

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-secondary);font-size:13px;">No matching transactions found.</div>`;
        return;
      }

      filtered.forEach(tx => {
        const isIncoming = tx.type === 'transfer' && tx.toCardId === card.id;
        const displayAmt = isIncoming ? formatMoney(tx.convertedAmount, card.currency) : formatMoney(tx.totalDeducted || tx.amount, card.currency);
        const prefix = tx.type === 'add' || isIncoming ? '+' : '−';
        const dStr = new Date(tx.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

        const item = document.createElement('div');
        item.className = 'tx-item';
        item.innerHTML = `
          <div class="tx-left">
            <div class="tx-avatar">${tx.icon || '💳'}</div>
            <div class="tx-meta">
              <div class="tx-cat">${tx.categoryName}${tx.note ? ` · ${tx.note}` : ''}</div>
              <div class="tx-sub">${dStr}</div>
            </div>
          </div>
          <div class="tx-amount ${isIncoming ? 'add' : tx.type}">${prefix}${displayAmt}</div>
        `;
        list.appendChild(item);
      });
    }

    function renderSettingsCards() {
      const box = document.getElementById('settingsCardsList');
      if (!box) return;
      box.innerHTML = '';
      state.cards.forEach(card => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-input);border-radius:14px;';
        row.innerHTML = `
          <div>
            <div style="font-size:14px;font-weight:700;">${card.name} ••${card.digits}</div>
            <div style="font-size:12px;color:var(--emerald);font-weight:700;">${formatMoney(card.balance, card.currency)} (${card.currency})</div>
          </div>
          ${state.cards.length > 1 ? `<button class="pill-btn" style="background:var(--danger-bg);color:var(--danger);padding:6px 12px;font-size:12px;" data-del="${card.id}">Remove</button>` : ''}
        `;
        const delBtn = row.querySelector('[data-del]');
        if (delBtn) {
          delBtn.addEventListener('click', () => {
            state.cards = state.cards.filter(c => c.id !== card.id);
            saveState();
            renderSettingsCards();
            refreshAll();
          });
        }
        box.appendChild(row);
      });
    }

    function renderSwatches() {
      const box = document.getElementById('cardColorSwatches');
      if (!box) return;
      box.innerHTML = '';
      CARD_DESIGNS.forEach((design, idx) => {
        const s = document.createElement('div');
        s.className = 'swatch' + (design.grad === selectedGradient ? ' active' : '');
        s.style.background = design.grad;
        s.dataset.name = design.name;
        s.title = design.name;
        s.addEventListener('click', () => {
          selectedGradient = design.grad;
          selectedNetwork = design.defaultNetwork || "VISA";
          document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
          s.classList.add('active');
        });
        box.appendChild(s);
      });
    }

    let toastTimer = null;
    function showToast(msg, isError = false, withUndo = false) {
      const el = document.getElementById('toastEl');
      el.classList.toggle('error', isError);
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toastUndoBtn').style.display = withUndo ? 'inline-block' : 'none';
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 4000);
    }

    function hideToast() {
      document.getElementById('toastEl').classList.remove('show');
    }

    function refreshAll() {
      applyTheme();
      updateHeaderTotals();
      renderCards();
      renderTransactions();
    }

    // Event Listeners Setup
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        triggerHaptic();
        state.darkMode = !state.darkMode;
        saveState();
        applyTheme();
      });

      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          homeActivityFilter = btn.dataset.filter;
          renderTransactions();
        });
      });

      const carouselEl = document.getElementById('cardsCarousel');
      if (carouselEl) {
        carouselEl.addEventListener('scroll', (e) => {
          const el = e.target;
          const cardWidth = el.firstElementChild ? el.firstElementChild.offsetWidth + 14 : 340;
          const idx = Math.round(el.scrollLeft / cardWidth);
          if (idx !== activeCardIndex && idx >= 0 && idx < state.cards.length) {
            activeCardIndex = idx;
            updateHeroForActiveCard();
            renderTransactions();
          }
        });
      }

      document.getElementById('openAddBtn').addEventListener('click', () => openEntryOverlay('add'));
      document.getElementById('openExpenseBtn').addEventListener('click', () => openEntryOverlay('expense'));
      document.getElementById('openTransferBtn').addEventListener('click', () => openEntryOverlay('transfer'));
      
      const closeEntryBtn = document.getElementById('closeEntryBtn');
      const closeOverlay = (e) => {
        e.preventDefault();
        e.stopPropagation();
        document.getElementById('entryOverlay').classList.remove('open');
      };
      closeEntryBtn.addEventListener('click', closeOverlay);
      closeEntryBtn.addEventListener('pointerdown', closeOverlay);

      document.getElementById('submitTxBtn').addEventListener('click', submitTransaction);

      document.getElementById('closeCustomCatBtn').addEventListener('click', () => document.getElementById('customCatBackdrop').classList.remove('open'));
      document.getElementById('saveCustomCatBtn').addEventListener('click', () => {
        const name = document.getElementById('newCatName').value.trim();
        if (!name) return showToast('Enter a category name', true);
        const newCat = { id: 'cat_' + Date.now(), name, icon: selectedNewIcon };
        state.categories.push(newCat);
        selectedCatId = newCat.id;
        saveState();
        renderCategoryStrip();
        document.getElementById('customCatBackdrop').classList.remove('open');
        showToast(`Category "${name}" added`);
      });

      document.getElementById('closeStmtBtn').addEventListener('click', () => document.getElementById('statementBackdrop').classList.remove('open'));
      ['stmtFromDate', 'stmtToDate', 'stmtSearchInput', 'stmtTypeFilter'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', renderStatementTransactions);
        if (el && el.tagName === 'SELECT') el.addEventListener('change', renderStatementTransactions);
      });
      document.getElementById('downloadPdfBtn').addEventListener('click', () => window.print());

      document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
      document.getElementById('closeSettingsBtn').addEventListener('click', () => document.getElementById('settingsBackdrop').classList.remove('open'));

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('cardsTab').style.display = btn.dataset.tab === 'cardsTab' ? 'block' : 'none';
          document.getElementById('backupTab').style.display = btn.dataset.tab === 'backupTab' ? 'block' : 'none';
        });
      });

      document.getElementById('saveNewCardBtn').addEventListener('click', () => {
        const name = document.getElementById('newCardName').value.trim();
        if (!name) return showToast('Please enter card name', true);
        const digits = document.getElementById('newCardDigits').value.trim() || String(Math.floor(1000 + Math.random() * 9000));
        const currency = document.getElementById('newCardCurrency').value || 'EUR';
        const balance = parseFloat(document.getElementById('newCardBalance').value) || 0;

        state.cards.push({
          id: 'card_' + Date.now(),
          name,
          digits,
          currency,
          balance,
          gradient: selectedGradient,
          network: selectedNetwork
        });

        document.getElementById('newCardName').value = '';
        document.getElementById('newCardDigits').value = '';
        document.getElementById('newCardBalance').value = '';
        saveState();
        renderSettingsCards();
        refreshAll();
        showToast('New card added');
      });

      document.getElementById('resetWalletBtn').addEventListener('click', () => {
        if (!confirm('Are you sure you want to reset all wallet data? This will clear all cards and transactions permanently.')) return;
        localStorage.removeItem(STORAGE_KEY);
        state = getDefaultState();
        activeCardIndex = 0;
        saveState();
        refreshAll();
        document.getElementById('settingsBackdrop').classList.remove('open');
        showToast('Wallet reset to default', true);
      });

      document.getElementById('copyBackupBtn').addEventListener('click', async () => {
        const text = document.getElementById('backupExportText').value;
        try {
          await navigator.clipboard.writeText(text);
          showToast('Backup JSON copied to clipboard!');
        } catch (e) {
          document.getElementById('backupExportText').select();
          document.execCommand('copy');
          showToast('Backup JSON copied!');
        }
      });

      document.getElementById('restoreBackupBtn').addEventListener('click', () => {
        const raw = document.getElementById('backupImportText').value.trim();
        if (!raw) return showToast('Paste backup JSON text first', true);
        try {
          const parsed = JSON.parse(raw);
          if (!parsed.cards || !Array.isArray(parsed.cards)) throw new Error('Invalid format');
          state = parsed;
          saveState();
          refreshAll();
          document.getElementById('settingsBackdrop').classList.remove('open');
          showToast('Wallet data restored!');
        } catch (e) {
          showToast('Invalid JSON backup text', true);
        }
      });

      refreshAll();
    });

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      refreshAll();
    }
  </script>
</body>
</html>
