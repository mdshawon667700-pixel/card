        cards: [
          {
            id: 'card_1',
            name: 'Metal Bronze',
            digits: '4568',
            currency: 'EUR',
            balance: 50000.00,
            gradient: CARD_DESIGNS[0].grad,
            network: "VISA"
          },
          {
            id: 'card_2',
            name: 'Sage Green',
            digits: '8824',
            currency: 'BDT',
            balance: 100,
            gradient: CARD_DESIGNS[8].grad,
            network: "Mastercard"
          }
        ],
        categories: [...DEFAULT_CATEGORIES],
        transactions: []
      };
    }

    let state = loadState();
    let activeCardIndex = 0;
    let homeActivityFilter = 'all';
    let homeSearchQuery = '';
    let homeCategoryFilter = 'all';
    let entryMode = 'add';
    let editingTxId = null;
    let selectedActionTxId = null;
    let selectedCatId = null;
    let selectedGradient = CARD_DESIGNS[0].grad;
    let selectedNetwork = "VISA";
    let selectedNewIcon = ICON_LIBRARY[0];
    let statementCardId = null;

    function t(key) {
      const langDict = TRANSLATIONS[state.lang] || TRANSLATIONS.en;
      return langDict[key] || TRANSLATIONS.en[key] || key;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('pocketflow_wallet_v9') || localStorage.getItem('pocketflow_wallet_v8');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.cards) && parsed.cards.length > 0) {
            if (!parsed.theme) parsed.theme = parsed.darkMode ? 'dark' : 'light';
            if (!parsed.lang) parsed.lang = 'en';
            return parsed;
          }
        }
      } catch (e) {}
      return getDefaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    function formatMoney(amount, currencyCode) {
      const meta = CURRENCY_META[currencyCode] || CURRENCY_META.EUR;
      const num = Number(amount) || 0;
      const decimals = currencyCode === 'JPY' || currencyCode === 'BDT' ? 0 : 2;
      return `${meta.symbol}${num.toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      })}`;
    }

    function applyTheme() {
      const themeId = state.theme || 'light';
      document.documentElement.setAttribute('data-theme', themeId);
      document.body.setAttribute('data-theme', themeId);
      const themeObj = APP_THEMES.find(th => th.id === themeId) || APP_THEMES[0];
      const metaTheme = document.getElementById('metaThemeColor');
      if (metaTheme) metaTheme.setAttribute('content', themeObj.meta);
    }

    function applyTranslations() {
      document.documentElement.lang = state.lang || 'en';
      const langObj = LANGUAGES.find(l => l.code === state.lang) || LANGUAGES[0];
      const langBtn = document.getElementById('quickLangBtn');
      if (langBtn) langBtn.textContent = langObj.short;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });

      const homeSearch = document.getElementById('homeSearchInput');
      if (homeSearch) homeSearch.placeholder = t('searchPlaceholder');
      const stmtSearch = document.getElementById('stmtSearchInput');
      if (stmtSearch) stmtSearch.placeholder = t('searchPlaceholder');
      const noteInput = document.getElementById('entryNoteInput');
      if (noteInput) noteInput.placeholder = t('notePlaceholder');
    }

    function renderThemeAndLangGrids() {
      const grids = ['quickThemeGrid', 'settingsThemeGrid'];
      grids.forEach(gridId => {
        const container = document.getElementById(gridId);
        if (!container) return;
        container.innerHTML = '';
        APP_THEMES.forEach(th => {
          const card = document.createElement('div');
          card.className = 'theme-option-card' + (state.theme === th.id ? ' active' : '');
          card.innerHTML = `
            <div class="theme-preview-dot" style="background: linear-gradient(135deg, ${th.bg} 50%, ${th.accent} 50%);"></div>
            <span style="font-size:12.5px;font-weight:700;">${th.name}</span>
          `;
          card.addEventListener('click', () => {
            triggerHaptic();
            state.theme = th.id;
            saveState();
            applyTheme();
            renderThemeAndLangGrids();
          });
          container.appendChild(card);
        });
      });

      const langGrids = ['quickLangGrid', 'settingsLangGrid'];
      langGrids.forEach(gridId => {
        const container = document.getElementById(gridId);
        if (!container) return;
        container.innerHTML = '';
        LANGUAGES.forEach(lg => {
          const btn = document.createElement('button');
          btn.className = 'lang-option-btn' + (state.lang === lg.code ? ' active' : '');
          btn.textContent = lg.label;
          btn.addEventListener('click', () => {
            triggerHaptic();
            state.lang = lg.code;
            saveState();
            refreshAll(false);
            renderThemeAndLangGrids();
          });
          container.appendChild(btn);
        });
      });
    }

    function updateHeaderTotals() {
      let totalEur = 0;
      let totalBdt = 0;

      if (!state.cards || !Array.isArray(state.cards)) return;

      state.cards.forEach(c => {
        const bal = Number(c.balance) || 0;
        if (c.currency === 'BDT') {
          totalBdt += bal;
        } else {
          const rate = (CURRENCY_META[c.currency] || CURRENCY_META.EUR).rateToEur;
          totalEur += bal * rate;
        }
      });

      document.getElementById('totalEurMini').textContent = `€${totalEur.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      document.getElementById('totalBdtMini').textContent = `৳${totalBdt.toLocaleString('en-US', { maximumFractionDigits: 0 })}`;
    }

    function populateHomeCategoryFilter() {
      const sel = document.getElementById('homeCatFilter');
      if (!sel) return;
      const currentVal = sel.value || homeCategoryFilter;
      sel.innerHTML = `<option value="all">${t('allCategories')}</option>`;
      (state.categories || []).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${cat.icon} ${cat.name}`;
        sel.appendChild(opt);
      });
      if ([...sel.options].some(o => o.value === currentVal)) {
        sel.value = currentVal;
      } else {
        sel.value = 'all';
        homeCategoryFilter = 'all';
      }
    }

    function renderCards() {
      const carousel = document.getElementById('cardsCarousel');
      const dots = document.getElementById('cardDots');
      if (!carousel || !dots) return;

      carousel.innerHTML = '';
      dots.innerHTML = '';

      if (!state.cards || state.cards.length === 0) {
        state.cards = getDefaultState().cards;
      }

      if (activeCardIndex >= state.cards.length) activeCardIndex = Math.max(0, state.cards.length - 1);

      state.cards.forEach((card, idx) => {
        const el = document.createElement('div');
        el.className = 'wallet-card';
        el.style.background = card.gradient || CARD_DESIGNS[0].grad;
        el.dataset.cardId = card.id;

        const netLogo = card.network || "VISA";
        const isMaster = netLogo === "Mastercard";

        el.innerHTML = `
          <div class="glare-shine"></div>
          <div class="card-top">
            <span class="card-brand">PocketFlow</span>
            <span class="card-currency-pill">${card.currency}</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-top:-10px;">
            <div class="card-chip"></div>
            <div class="card-contactless">📶</div>
          </div>
          <div class="card-mid">
            <div>
              <div class="card-bal-label">${card.name}</div>
              <div class="card-bal-val">${formatMoney(card.balance, card.currency)}</div>
            </div>
          </div>
          <div class="card-bottom">
            <span>•••• ${card.digits || '4568'}</span>
            <span class="card-network-logo" style="${isMaster ? 'color:#ff5f00;' : 'color:#fff; font-weight:900;'}">${netLogo}</span>
          </div>
        `;
        el.addEventListener('click', () => openStatementModal(card.id));
        carousel.appendChild(el);

        const dot = document.createElement('div');
        dot.className = 'dot' + (idx === activeCardIndex ? ' active' : '');
        dots.appendChild(dot);
      });

      updateHeroForActiveCard();
    }

    function updateHeroForActiveCard() {
      if (!state.cards || state.cards.length === 0) return;
      const card = state.cards[activeCardIndex] || state.cards[0];
      if (!card) return;
      document.getElementById('activeCardLabel').textContent = `${card.name} ••${card.digits}`;
      document.getElementById('heroBalanceDisplay').textContent = formatMoney(card.balance, card.currency);
      document.getElementById('selectedCardFilterBtn').textContent = `${card.name} (${t('onlySuffix')})`;
      document.querySelectorAll('#cardDots .dot').forEach((d, i) => {
        d.classList.toggle('active', i === activeCardIndex);
      });
    }

    function renderTransactions(animate = false) {
      const list = document.getElementById('txList');
      if (!list) return;
      list.innerHTML = '';

      if (!state.cards || state.cards.length === 0) return;
      const activeCard = state.cards[activeCardIndex] || state.cards[0];
      const now = new Date();
      let monthIn = 0;
      let monthOut = 0;

      (state.transactions || []).forEach(tx => {
        const d = new Date(tx.date);
        if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
          if (tx.cardId === activeCard.id) {
            if (tx.type === 'add') monthIn += Number(tx.amount);
            if (tx.type === 'expense' || tx.type === 'transfer') monthOut += Number(tx.totalDeducted || tx.amount);
          }
        }
      });

      const sym = (CURRENCY_META[activeCard.currency] || CURRENCY_META.EUR).symbol;
      document.getElementById('monthInVal').textContent = `+${sym}${monthIn.toFixed(0)}`;
      document.getElementById('monthOutVal').textContent = `−${sym}${monthOut.toFixed(0)}`;

      const q = homeSearchQuery.trim().toLowerCase();
      const filteredTxs = (state.transactions || []).filter(tx => {
        if (homeActivityFilter === 'selected' && tx.cardId !== activeCard.id && tx.toCardId !== activeCard.id) {
          return false;
        }
        if (homeCategoryFilter !== 'all' && tx.categoryId !== homeCategoryFilter) {
          return false;
        }
        if (q) {
          const catObj = state.categories.find(c => c.id === tx.categoryId);
          const catName = catObj ? catObj.name : (tx.categoryName || '');
          const cardObj = state.cards.find(c => c.id === tx.cardId);
          const cardName = cardObj ? cardObj.name : '';
          const searchable = `${catName} ${tx.note || ''} ${cardName} ${tx.amount}`.toLowerCase();
          if (!searchable.includes(q)) return false;
        }
        return true;
      });

      if (filteredTxs.length === 0) {
        const hasFilters = q || homeCategoryFilter !== 'all' || homeActivityFilter !== 'all';
        list.innerHTML = `<div class="empty-state">${hasFilters ? t('noMatchFound') : t('noTxFound')}</div>`;
        return;
      }

      filteredTxs.slice(0, 35).forEach((tx, index) => {
        const card = state.cards.find(c => c.id === tx.cardId) || activeCard;
        const cat = state.categories.find(c => c.id === tx.categoryId) || { name: tx.categoryName || 'Entry', icon: tx.icon || '💳' };
        const dateStr = new Date(tx.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });

        let displayAmtStr = '';
        let prefix = '';
        let amountClass = tx.type;

        if (tx.type === 'add') {
          prefix = '+';
          displayAmtStr = formatMoney(tx.amount, card.currency);
        } else if (tx.type === 'expense') {
          prefix = '−';
          displayAmtStr = formatMoney(tx.amount, card.currency);
        } else if (tx.type === 'transfer') {
          const toCard = state.cards.find(c => c.id === tx.toCardId);
          prefix = '⇄ ';
          displayAmtStr = `${formatMoney(tx.totalDeducted || tx.amount, card.currency)} ➔ ${formatMoney(tx.convertedAmount, toCard ? toCard.currency : card.currency)}`;
          amountClass = 'transfer';
        }

        const row = document.createElement('div');
        row.className = 'tx-item' + (animate ? ' tx-enter' : '');
        if (animate) {
          row.style.animationDelay = `${Math.min(index, 8) * 0.025}s`;
        }
        row.innerHTML = `
          <div class="tx-left">
            <div class="tx-avatar">${cat.icon}</div>
            <div class="tx-meta">
              <div class="tx-cat">${cat.name}${tx.note ? ` · <span style="font-weight:500;color:var(--text-secondary)">${tx.note}</span>` : ''}</div>
              <div class="tx-sub">${card.name} • ${dateStr}</div>
            </div>
          </div>
          <div class="tx-amount ${amountClass}" style="font-size:13.5px;">${prefix}${displayAmtStr}</div>
        `;
        row.addEventListener('click', () => openTxActionSheet(tx.id));
        list.appendChild(row);
      });
    }

    function openTxActionSheet(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx) return;
      triggerHaptic();
      selectedActionTxId = txId;

      const card = state.cards.find(c => c.id === tx.cardId) || state.cards[0];
      const cat = state.categories.find(c => c.id === tx.categoryId) || { name: tx.categoryName || 'Entry', icon: tx.icon || '💳' };
      const dateStr = new Date(tx.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const amtStr = formatMoney(tx.sourceAmount || tx.amount, card.currency);

      document.getElementById('txActionIcon').textContent = cat.icon;
      document.getElementById('txActionTitle').textContent = `${cat.name} (${amtStr})`;
      document.getElementById('txActionSub').textContent = `${card.name} • ${dateStr}${tx.note ? ` • "${tx.note}"` : ''}`;
      document.getElementById('txActionBackdrop').classList.add('open');
    }

    function revertTransactionBalance(tx) {
      const card = state.cards.find(c => c.id === tx.cardId);
      if (!card) return;
      if (tx.type === 'add') {
        card.balance = Math.max(0, Number(card.balance) - Number(tx.amount));
      } else if (tx.type === 'expense') {
        card.balance = Number(card.balance) + Number(tx.amount);
      } else if (tx.type === 'transfer') {
        card.balance = Number(card.balance) + Number(tx.totalDeducted || tx.amount);
        const toCard = state.cards.find(c => c.id === tx.toCardId);
        if (toCard) {
          toCard.balance = Math.max(0, Number(toCard.balance) - Number(tx.convertedAmount));
        }
      }
    }

    function deleteTransactionById(txId) {
      const idx = state.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = state.transactions[idx];
      if (!confirm(`Delete "${tx.categoryName}"?`)) return;

      revertTransactionBalance(tx);
      state.transactions.splice(idx, 1);
      saveState();
      refreshAll(true);
      showToast('Deleted & balance restored', false);
    }

    function openEditTransaction(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx) return;

      const cardIdx = state.cards.findIndex(c => c.id === tx.cardId);
      if (cardIdx !== -1) {
        activeCardIndex = cardIdx;
        const carousel = document.getElementById('cardsCarousel');
        if (carousel && carousel.children[cardIdx]) {
          carousel.children[cardIdx].scrollIntoView({ behavior: 'smooth', inline: 'center' });
        }
        updateHeroForActiveCard();
      }

      openEntryOverlay(tx.type, tx);
    }

    function openEntryOverlay(mode, editTx = null) {
      triggerHaptic();
      entryMode = mode;
      editingTxId = editTx ? editTx.id : null;

      selectedCatId = editTx ? editTx.categoryId : null;
      document.getElementById('nativeAmountInput').value = editTx ? (editTx.sourceAmount || editTx.amount) : '';
      document.getElementById('entryNoteInput').value = editTx ? (editTx.note || '') : '';

      const card = state.cards[activeCardIndex] || state.cards[0];
      const sym = (CURRENCY_META[card.currency] || CURRENCY_META.EUR).symbol;
      document.getElementById('entryCurrencySym').textContent = sym;

      if (editTx) {
        const editTitles = { add: t('editIncomeTitle'), expense: t('editExpenseTitle'), transfer: t('editTransferTitle') };
        document.getElementById('entryModeTitle').textContent = editTitles[mode];
        document.getElementById('submitTxBtn').textContent = t('saveChangesBtn');
      } else {
        const titleMap = { add: t('addMoneyTitle'), expense: t('addExpenseTitle'), transfer: t('transferTitle') };
        document.getElementById('entryModeTitle').textContent = titleMap[mode];
        document.getElementById('submitTxBtn').textContent = mode === 'add' ? t('addToCardBtn') : mode === 'expense' ? t('sendExpenseBtn') : t('completeTransferBtn');
      }

      const transferBar = document.getElementById('transferBar');
      if (mode === 'transfer' && state.cards.length > 1) {
        transferBar.classList.add('visible');
        const sel = document.getElementById('transferToSelect');
        sel.innerHTML = '';
        state.cards.forEach((c, idx) => {
          if (idx !== activeCardIndex) {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.name} (${c.currency}) — ${formatMoney(c.balance, c.currency)}`;
            sel.appendChild(opt);
          }
        });

        if (editTx && editTx.toCardId) {
          sel.value = editTx.toCardId;
          if (editTx.exchangeRate) document.getElementById('manualRateInput').value = editTx.exchangeRate;
          if (editTx.transferFee !== undefined) document.getElementById('manualFeeInput').value = editTx.transferFee;
          if (editTx.chargeMode) document.getElementById('chargeModeSelect').value = editTx.chargeMode;
        }
        updateTransferLiveCalculation();
      } else {
        transferBar.classList.remove('visible');
      }

      renderCategoryStrip();
      renderPresets(card.currency);
      document.getElementById('entryOverlay').classList.add('open');

      setTimeout(() => {
        const amtInput = document.getElementById('nativeAmountInput');
        if (amtInput) amtInput.focus();
      }, 300);
    }

    function updateTransferLiveCalculation() {
      const amount = parseFloat(document.getElementById('nativeAmountInput').value) || 0;
      const fromCard = state.cards[activeCardIndex] || state.cards[0];
      const toCardId = document.getElementById('transferToSelect').value;
      const toCard = state.cards.find(c => c.id === toCardId) || state.cards.find((c, i) => i !== activeCardIndex);
      const summaryBox = document.getElementById('transferFxSummary');
      const fxFieldsContainer = document.getElementById('fxRateFieldsContainer');
      const chargeModeContainer = document.getElementById('chargeModeContainer');

      const isSameCurrency = toCard && fromCard.currency === toCard.currency;

      if (isSameCurrency) {
        fxFieldsContainer.style.display = 'none';
        chargeModeContainer.style.display = 'none';
        const sym = (CURRENCY_META[fromCard.currency] || CURRENCY_META.EUR).symbol;
        summaryBox.innerHTML = `
          <div>🔄 <strong>Direct (${fromCard.currency} ➔ ${fromCard.currency}):</strong> ${sym}${amount.toFixed(2)}</div>
        `;
      } else {
        fxFieldsContainer.style.display = 'flex';
        chargeModeContainer.style.display = 'block';

        const rate = parseFloat(document.getElementById('manualRateInput').value) || 130;
        const fee = parseFloat(document.getElementById('manualFeeInput').value) || 0;
        const chargeMode = document.getElementById('chargeModeSelect').value;
        const toCurr = toCard ? toCard.currency : 'BDT';
        const toSym = (CURRENCY_META[toCurr] || CURRENCY_META.BDT).symbol;
        const fromSym = (CURRENCY_META[fromCard.currency] || CURRENCY_META.EUR).symbol;

        document.getElementById('fxRateLabel').textContent = `Rate (1 ${fromCard.currency} = ?)`;

        let netPrincipal = amount;
        let totalDeducted = amount;
        let targetReceived = 0;

        if (chargeMode === 'deduct_from_amount') {
          netPrincipal = Math.max(0, amount - fee);
          totalDeducted = amount;
          targetReceived = netPrincipal * rate;
        } else {
          netPrincipal = amount;
          totalDeducted = amount + fee;
          targetReceived = netPrincipal * rate;
        }

        summaryBox.innerHTML = `
          <div>💱 <strong>1 ${fromCard.currency} = ${rate} ${toCurr}</strong></div>
          <div>💸 <strong>Total Deducted:</strong> ${fromSym}${totalDeducted.toFixed(2)} (Fee: ${fromSym}${fee.toFixed(2)})</div>
          <div>🎯 <strong>${toCard ? toCard.name : 'Receiver'}:</strong> ${toSym}${targetReceived.toLocaleString('en-US', {maximumFractionDigits:0})}</div>
        `;
      }
    }

    document.getElementById('nativeAmountInput')?.addEventListener('input', updateTransferLiveCalculation);
    document.getElementById('manualRateInput')?.addEventListener('input', updateTransferLiveCalculation);
    document.getElementById('manualFeeInput')?.addEventListener('input', updateTransferLiveCalculation);
    document.getElementById('chargeModeSelect')?.addEventListener('change', updateTransferLiveCalculation);
    document.getElementById('transferToSelect')?.addEventListener('change', updateTransferLiveCalculation);

    function renderCategoryStrip() {
      const strip = document.getElementById('catStrip');
      if (!strip) return;
      strip.innerHTML = '';

      state.categories.forEach(cat => {
        const isSelected = cat.id === selectedCatId;
        const item = document.createElement('div');
        item.className = 'cat-item' + (isSelected ? ' selected' : '');
        item.innerHTML = `
          <div class="cat-circle">${cat.icon}</div>
          <span class="cat-label">${cat.name}</span>
        `;
        item.addEventListener('click', () => {
          triggerHaptic();
          selectedCatId = isSelected ? null : cat.id;
          renderCategoryStrip();
        });
        strip.appendChild(item);
      });

      const customItem = document.createElement('div');
      customItem.className = 'cat-item';
      customItem.innerHTML = `
        <div class="cat-circle" style="font-weight:800;">+</div>
        <span class="cat-label">${t('customLabel')}</span>
      `;
      customItem.addEventListener('click', openCustomCatSheet);
      strip.appendChild(customItem);
    }

    function renderPresets(currency) {
      const presets = currency === 'BDT' || currency === 'JPY' ? [100, 500, 1000, 2000, 5000] : [10, 20, 50, 100, 250];
      const sym = (CURRENCY_META[currency] || CURRENCY_META.EUR).symbol;
      const row = document.getElementById('presetsRow');
      if (!row) return;
      row.innerHTML = '';
      presets.forEach(val => {
        const chip = document.createElement('button');
        chip.className = 'preset-chip';
        chip.textContent = `${sym}${val}`;
        chip.addEventListener('click', () => {
          triggerHaptic();
          document.getElementById('nativeAmountInput').value = val;
          updateTransferLiveCalculation();
        });
        row.appendChild(chip);
      });
    }

    function spawnConfetti() {
      const stage = document.getElementById('confirmStage');
      if (!stage) return;
      const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'];
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-piece';
        const angle = (Math.PI * 2 * i) / 16;
        const dist = 55 + Math.random() * 45;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist - 15}px`);
        p.style.background = colors[i % colors.length];
        stage.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function submitTransaction() {
      if (!selectedCatId) {
        triggerHaptic();
        showToast(t('selectCatFirst'), true);
        return;
      }

      const amountVal = document.getElementById('nativeAmountInput').value;
      const amount = parseFloat(amountVal);
      if (!amount || amount <= 0) {
        showToast(t('validAmountErr'), true);
        return;
      }

      const card = state.cards[activeCardIndex] || state.cards[0];
      const cat = state.categories.find(c => c.id === selectedCatId);
      const note = document.getElementById('entryNoteInput').value.trim();

      let oldTx = null;
      let effectiveBalance = Number(card.balance);
      if (editingTxId) {
        oldTx = state.transactions.find(t => t.id === editingTxId);
        if (oldTx && oldTx.cardId === card.id) {
          if (oldTx.type === 'expense' || oldTx.type === 'transfer') {
            effectiveBalance += Number(oldTx.totalDeducted || oldTx.amount);
          } else if (oldTx.type === 'add') {
            effectiveBalance = Math.max(0, effectiveBalance - Number(oldTx.amount));
          }
        }
      }

      let totalDeducted = amount;
      let convertedAmount = amount;
      let transferFee = 0;
      let exchangeRate = 1;
      let chargeMode = 'deduct_from_amount';
      let toCardId = null;

      if (entryMode === 'transfer') {
        toCardId = document.getElementById('transferToSelect').value;
        const toCard = state.cards.find(c => c.id === toCardId);
        const isSameCurrency = toCard && card.currency === toCard.currency;

        if (isSameCurrency) {
          totalDeducted = amount;
          convertedAmount = amount;
        } else {
          exchangeRate = parseFloat(document.getElementById('manualRateInput').value) || 130;
          transferFee = parseFloat(document.getElementById('manualFeeInput').value) || 0;
          chargeMode = document.getElementById('chargeModeSelect').value;

          if (chargeMode === 'deduct_from_amount') {
            const netSource = Math.max(0, amount - transferFee);
            totalDeducted = amount;
            convertedAmount = netSource * exchangeRate;
          } else {
            totalDeducted = amount + transferFee;
            convertedAmount = amount * exchangeRate;
          }
        }
      }

      if ((entryMode === 'expense' || entryMode === 'transfer') && effectiveBalance < totalDeducted) {
        triggerHaptic();
        const backdrop = document.getElementById('confirmBackdrop');
        const spinner = document.getElementById('confirmSpinner');
        const avatar = document.getElementById('confirmAvatar');
        const title = document.getElementById('confirmTitle');
        const sub = document.getElementById('confirmSub');

        spinner.style.display = 'none';
        avatar.className = 'ring-avatar declined';
        avatar.textContent = '✕';
        title.textContent = t('txDeclined');
        sub.textContent = `${t('insufficientBal')} (${formatMoney(effectiveBalance, card.currency)})`;
        backdrop.classList.add('open');

        setTimeout(() => {
          backdrop.classList.remove('open');
          avatar.className = 'ring-avatar';
        }, 2200);

        showToast(t('insufficientBal'), true);
        return;
      }

      if (entryMode === 'transfer' && state.cards.length < 2) {
        showToast('Create at least 2 cards to transfer', true);
        return;
      }

      const backdrop = document.getElementById('confirmBackdrop');
      const spinner = document.getElementById('confirmSpinner');
      const avatar = document.getElementById('confirmAvatar');
      const title = document.getElementById('confirmTitle');
      const sub = document.getElementById('confirmSub');

      spinner.style.display = 'block';
      avatar.className = 'ring-avatar';
      avatar.textContent = cat.icon;
      title.textContent = '...';
      sub.textContent = `${formatMoney(totalDeducted, card.currency)} • ${card.name}`;
      backdrop.classList.add('open');

      setTimeout(() => {
        triggerHaptic();
        spinner.style.display = 'none';
        avatar.classList.add('done');
        avatar.textContent = '✓';
        spawnConfetti();

        if (oldTx) {
          revertTransactionBalance(oldTx);
        }

        if (entryMode === 'add') {
          card.balance = Number(card.balance) + amount;
        } else if (entryMode === 'expense') {
          card.balance = Math.max(0, Number(card.balance) - amount);
        } else if (entryMode === 'transfer') {
          card.balance = Math.max(0, Number(card.balance) - totalDeducted);
          const toCard = state.cards.find(c => c.id === toCardId);
          if (toCard) {
            toCard.balance = Number(toCard.balance) + convertedAmount;
          }
        }

        const updatedRecord = {
          id: editingTxId || ('tx_' + Date.now()),
          cardId: card.id,
          toCardId,
          sourceAmount: amount,
          convertedAmount,
          transferFee,
          exchangeRate,
          chargeMode,
          totalDeducted,
          type: entryMode,
          categoryId: cat.id,
          categoryName: cat.name,
          icon: cat.icon,
          amount: entryMode === 'transfer' ? totalDeducted : amount,
          currency: card.currency,
          note,
          date: oldTx ? oldTx.date : new Date().toISOString()
        };

        if (editingTxId) {
          const txIndex = state.transactions.findIndex(t => t.id === editingTxId);
          if (txIndex !== -1) state.transactions[txIndex] = updatedRecord;
          editingTxId = null;
        } else {
          state.transactions.unshift(updatedRecord);
        }

        saveState();
        title.textContent = t('completed');
        sub.textContent = `${formatMoney(card.balance, card.currency)}`;

        setTimeout(() => {
          backdrop.classList.remove('open');
          document.getElementById('entryOverlay').classList.remove('open');
          refreshAll(true);

          const cardEl = document.querySelector(`.wallet-card[data-card-id="${card.id}"]`);
          if (cardEl) {
            cardEl.classList.add('glow-success');
            setTimeout(() => cardEl.classList.remove('glow-success'), 1100);
          }
        }, 700);
      }, 650);
    }

    function openCustomCatSheet() {
      document.getElementById('newCatName').value = '';
      const grid = document.getElementById('iconPickerGrid');
      grid.innerHTML = '';
      ICON_LIBRARY.forEach(ico => {
        const btn = document.createElement('div');
        btn.className = 'icon-choice' + (ico === selectedNewIcon ? ' active' : '');
        btn.textContent = ico;
        btn.addEventListener('click', () => {
          selectedNewIcon = ico;
          document.querySelectorAll('.icon-choice').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
        });
        grid.appendChild(btn);
      });
      document.getElementById('customCatBackdrop').classList.add('open');
    }

    function openStatementModal(cardId) {
      statementCardId = cardId;
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      document.getElementById('stmtCardTitle').textContent = `${card.name} (••${card.digits})`;
      document.getElementById('stmtCardBal').textContent = `${t('currentBalance')}: ${formatMoney(card.balance, card.currency)}`;
      document.getElementById('stmtFromDate').value = '';
      document.getElementById('stmtToDate').value = '';
      document.getElementById('stmtSearchInput').value = '';
      document.getElementById('stmtTypeFilter').value = 'all';
      renderStatementTransactions();
      document.getElementById('statementBackdrop').classList.add('open');
    }

    function renderStatementTransactions() {
      const list = document.getElementById('stmtTxList');
      if (!list) return;
      list.innerHTML = '';
      const card = state.cards.find(c => c.id === statementCardId);
      if (!card) return;

      const fromDate = document.getElementById('stmtFromDate').value;
      const toDate = document.getElementById('stmtToDate').value;
      const query = document.getElementById('stmtSearchInput').value.trim().toLowerCase();
      const typeFilter = document.getElementById('stmtTypeFilter').value;

      const filtered = (state.transactions || []).filter(tx => {
        if (tx.cardId !== card.id && tx.toCardId !== card.id) return false;
        if (typeFilter !== 'all' && tx.type !== typeFilter) return false;
        const txDay = tx.date.slice(0, 10);
        if (fromDate && txDay < fromDate) return false;
        if (toDate && txDay > toDate) return false;
        if (query) {
          const hay = `${tx.categoryName} ${tx.note || ''}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      let filteredTotal = 0;
      filtered.forEach(tx => {
        const isIncoming = tx.type === 'transfer' && tx.toCardId === card.id;
        filteredTotal += Number(isIncoming ? tx.convertedAmount : (tx.totalDeducted || tx.amount)) || 0;
      });

      document.getElementById('stmtSummaryLabel').textContent = `${t('filter' + typeFilter.charAt(0).toUpperCase() + typeFilter.slice(1))}:`;
      document.getElementById('stmtSummaryVal').textContent = formatMoney(filteredTotal, card.currency);

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-secondary);font-size:13px;">${t('noMatchFound')}</div>`;
        return;
      }

      filtered.forEach(tx => {
        const isIncoming = tx.type === 'transfer' && tx.toCardId === card.id;
        const displayAmt = isIncoming ? formatMoney(tx.convertedAmount, card.currency) : formatMoney(tx.totalDeducted || tx.amount, card.currency);
        const prefix = tx.type === 'add' || isIncoming ? '+' : '−';
        const dStr = new Date(tx.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

        const item = document.createElement('div');
        item.className = 'tx-item';
        item.innerHTML = `
          <div class="tx-left">
            <div class="tx-avatar">${tx.icon || '💳'}</div>
            <div class="tx-meta">
              <div class="tx-cat">${tx.categoryName}${tx.note ? ` · ${tx.note}` : ''}</div>
              <div class="tx-sub">${dStr}</div>
            </div>
          </div>
          <div class="tx-amount ${isIncoming ? 'add' : tx.type}">${prefix}${displayAmt}</div>
        `;
        item.addEventListener('click', () => {
          document.getElementById('statementBackdrop').classList.remove('open');
          openTxActionSheet(tx.id);
        });
        list.appendChild(item);
      });
    }

    function openSettingsModal() {
      renderSettingsCards();
      renderSwatches();
      renderThemeAndLangGrids();
      document.getElementById('backupExportText').value = JSON.stringify(state);
      document.getElementById('backupImportText').value = '';
      document.getElementById('settingsBackdrop').classList.add('open');
    }

    function renderSettingsCards() {
      const box = document.getElementById('settingsCardsList');
      if (!box) return;
      box.innerHTML = '';
      state.cards.forEach(card => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-input);border-radius:14px;';
        row.innerHTML = `
          <div>
            <div style="font-size:14px;font-weight:700;">${card.name} ••${card.digits}</div>
            <div style="font-size:12px;color:var(--emerald);font-weight:700;">${formatMoney(card.balance, card.currency)} (${card.currency})</div>
          </div>
          ${state.cards.length > 1 ? `<button class="pill-btn" style="background:var(--danger-bg);color:var(--danger);padding:6px 12px;font-size:12px;" data-del="${card.id}">Remove</button>` : ''}
        `;
        const delBtn = row.querySelector('[data-del]');
        if (delBtn) {
          delBtn.addEventListener('click', () => {
            state.cards = state.cards.filter(c => c.id !== card.id);
            saveState();
            renderSettingsCards();
            refreshAll(false);
          });
        }
        box.appendChild(row);
      });
    }

    function renderSwatches() {
      const box = document.getElementById('cardColorSwatches');
      if (!box) return;
      box.innerHTML = '';
      CARD_DESIGNS.forEach((design) => {
        const s = document.createElement('div');
        s.className = 'swatch' + (design.grad === selectedGradient ? ' active' : '');
        s.style.background = design.grad;
        s.title = design.name;
        s.addEventListener('click', () => {
          selectedGradient = design.grad;
          selectedNetwork = design.defaultNetwork || "VISA";
          document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
          s.classList.add('active');
        });
        box.appendChild(s);
      });
    }

    let toastTimer = null;
    function showToast(msg, isError = false, withUndo = false) {
      const el = document.getElementById('toastEl');
      el.classList.toggle('error', isError);
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toastUndoBtn').style.display = withUndo ? 'inline-block' : 'none';
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 4000);
    }

    function hideToast() {
      document.getElementById('toastEl').classList.remove('show');
    }

    function refreshAll(animateTx = false) {
      applyTheme();
      applyTranslations();
      updateHeaderTotals();
      populateHomeCategoryFilter();
      renderCards();
      renderTransactions(animateTx);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const openAppearance = () => {
        triggerHaptic();
        renderThemeAndLangGrids();
        document.getElementById('appearanceBackdrop').classList.add('open');
      };
      document.getElementById('quickThemeBtn').addEventListener('click', openAppearance);
      document.getElementById('quickLangBtn').addEventListener('click', openAppearance);
      document.getElementById('closeAppearanceBtn').addEventListener('click', () => {
        document.getElementById('appearanceBackdrop').classList.remove('open');
      });
      document.getElementById('appearanceBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'appearanceBackdrop') document.getElementById('appearanceBackdrop').classList.remove('open');
      });

      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          homeActivityFilter = btn.dataset.filter;
          renderTransactions(false);
        });
      });

      const homeSearchInput = document.getElementById('homeSearchInput');
      const homeSearchClear = document.getElementById('homeSearchClear');
      homeSearchInput.addEventListener('input', (e) => {
        homeSearchQuery = e.target.value;
        homeSearchClear.style.display = homeSearchQuery ? 'flex' : 'none';
        renderTransactions(false);
      });
      homeSearchClear.addEventListener('click', () => {
        homeSearchQuery = '';
        homeSearchInput.value = '';
        homeSearchClear.style.display = 'none';
        renderTransactions(false);
      });
      document.getElementById('homeCatFilter').addEventListener('change', (e) => {
        homeCategoryFilter = e.target.value;
        renderTransactions(false);
      });

      document.getElementById('closeTxActionBtn').addEventListener('click', () => {
        document.getElementById('txActionBackdrop').classList.remove('open');
      });
      document.getElementById('txActionBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'txActionBackdrop') {
          document.getElementById('txActionBackdrop').classList.remove('open');
        }
      });
      document.getElementById('txActionEditBtn').addEventListener('click', () => {
        document.getElementById('txActionBackdrop').classList.remove('open');
        if (selectedActionTxId) openEditTransaction(selectedActionTxId);
      });
      document.getElementById('txActionDeleteBtn').addEventListener('click', () => {
        document.getElementById('txActionBackdrop').classList.remove('open');
        if (selectedActionTxId) deleteTransactionById(selectedActionTxId);
      });

      const carouselEl = document.getElementById('cardsCarousel');
      if (carouselEl) {
        let rafId = null;
        let txTimer = null;

        carouselEl.addEventListener('scroll', () => {
          if (rafId) return;
          rafId = requestAnimationFrame(() => {
            const firstCard = carouselEl.firstElementChild;
            const cardWidth = firstCard ? firstCard.offsetWidth + 14 : 340;
            const idx = Math.round(carouselEl.scrollLeft / cardWidth);
            if (idx !== activeCardIndex && idx >= 0 && idx < state.cards.length) {
              activeCardIndex = idx;
              updateHeroForActiveCard();

              clearTimeout(txTimer);
              txTimer = setTimeout(() => {
                renderTransactions(false);
              }, 90);
            }
            rafId = null;
          });
        }, { passive: true });
      }

      document.getElementById('openAddBtn').addEventListener('click', () => openEntryOverlay('add'));
      document.getElementById('openExpenseBtn').addEventListener('click', () => openEntryOverlay('expense'));
      document.getElementById('openTransferBtn').addEventListener('click', () => openEntryOverlay('transfer'));

      const closeEntryBtn = document.getElementById('closeEntryBtn');
      const closeOverlay = (e) => {
        e.preventDefault();
        e.stopPropagation();
        editingTxId = null;
        document.getElementById('entryOverlay').classList.remove('open');
      };
      closeEntryBtn.addEventListener('click', closeOverlay);
      closeEntryBtn.addEventListener('pointerdown', closeOverlay);

      document.getElementById('submitTxBtn').addEventListener('click', submitTransaction);

      document.getElementById('closeCustomCatBtn').addEventListener('click', () => document.getElementById('customCatBackdrop').classList.remove('open'));
      document.getElementById('saveCustomCatBtn').addEventListener('click', () => {
        const name = document.getElementById('newCatName').value.trim();
        if (!name) return showToast('Enter a category name', true);
        const newCat = { id: 'cat_' + Date.now(), name, icon: selectedNewIcon };
        state.categories.push(newCat);
        selectedCatId = newCat.id;
        saveState();
        populateHomeCategoryFilter();
        renderCategoryStrip();
        document.getElementById('customCatBackdrop').classList.remove('open');
        showToast(`"${name}" added`);
      });

      document.getElementById('closeStmtBtn').addEventListener('click', () => document.getElementById('statementBackdrop').classList.remove('open'));
      ['stmtFromDate', 'stmtToDate', 'stmtSearchInput', 'stmtTypeFilter'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', renderStatementTransactions);
        if (el && el.tagName === 'SELECT') el.addEventListener('change', renderStatementTransactions);
      });
      document.getElementById('downloadPdfBtn').addEventListener('click', () => window.print());

      document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
      document.getElementById('closeSettingsBtn').addEventListener('click', () => document.getElementById('settingsBackdrop').classList.remove('open'));

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('cardsTab').style.display = btn.dataset.tab === 'cardsTab' ? 'block' : 'none';
          document.getElementById('appearanceTab').style.display = btn.dataset.tab === 'appearanceTab' ? 'block' : 'none';
          document.getElementById('backupTab').style.display = btn.dataset.tab === 'backupTab' ? 'block' : 'none';
        });
      });

      document.getElementById('saveNewCardBtn').addEventListener('click', () => {
        const name = document.getElementById('newCardName').value.trim();
        if (!name) return showToast('Please enter card name', true);
        const digits = document.getElementById('newCardDigits').value.trim() || String(Math.floor(1000 + Math.random() * 9000));
        const currency = document.getElementById('newCardCurrency').value || 'EUR';
        const balance = parseFloat(document.getElementById('newCardBalance').value) || 0;

        state.cards.push({
          id: 'card_' + Date.now(),
          name,
          digits,
          currency,
          balance,
          gradient: selectedGradient,
          network: selectedNetwork
        });

        document.getElementById('newCardName').value = '';
        document.getElementById('newCardDigits').value = '';
        document.getElementById('newCardBalance').value = '';
        saveState();
        renderSettingsCards();
        refreshAll(false);
        showToast('New card added');
      });

      document.getElementById('resetWalletBtn').addEventListener('click', () => {
        if (!confirm('Are you sure you want to reset all wallet data?')) return;
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem('pocketflow_wallet_v9');
        localStorage.removeItem('pocketflow_wallet_v8');
        state = getDefaultState();
        activeCardIndex = 0;
        saveState();
        refreshAll(true);
        document.getElementById('settingsBackdrop').classList.remove('open');
        showToast('Wallet reset', true);
      });

      document.getElementById('copyBackupBtn').addEventListener('click', async () => {
        const text = document.getElementById('backupExportText').value;
        try {
          await navigator.clipboard.writeText(text);
          showToast('Backup JSON copied!');
        } catch (e) {
          document.getElementById('backupExportText').select();
          document.execCommand('copy');
          showToast('Backup JSON copied!');
        }
      });

      document.getElementById('restoreBackupBtn').addEventListener('click', () => {
        const raw = document.getElementById('backupImportText').value.trim();
        if (!raw) return showToast('Paste backup JSON first', true);
        try {
          const parsed = JSON.parse(raw);
          if (!parsed.cards || !Array.isArray(parsed.cards)) throw new Error('Invalid format');
          state = parsed;
          saveState();
          refreshAll(true);
          document.getElementById('settingsBackdrop').classList.remove('open');
          showToast('Wallet data restored!');
        } catch (e) {
          showToast('Invalid JSON backup text', true);
        }
      });

      refreshAll(true);
    });

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      refreshAll(true);
    }
  </script>
</body>
</html>
